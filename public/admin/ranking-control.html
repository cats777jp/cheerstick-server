<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>順位確定 | 推しフル管理画面</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 順位確定機能（Phase 4、2026-09-24追加）ページ固有分。
     .screen-url-row はevents.htmlの.battle-url-row（対抗戦スクリーンURL欄）と同じ構成。 */
  h3 { font-size: 13px; color: var(--text-muted); margin: 20px 0 8px; }
  .triggered-at-note { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
  .screen-url-row {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 6px;
  }
  .screen-url-row input {
    width: auto;
    flex: 1 1 220px;
    font-size: 12px;
    padding: 6px 8px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>順位確定</h1>
  <p><a href="index.html">&larr; 管理画面トップ</a></p>
  <div id="errorBar" class="error-bar"></div>

  <!-- 対抗戦用（上）：両チーム一括の順位確定と、順位発表画面（ranking-battle.html）のURL。
       下の「単独イベント用」とは独立。確定自体は既存のPOST /events/:id/ranking-snapshotを
       A・Bに対して続けて呼ぶだけ（新しいAPIは使わない）。順位発表画面は、推し選手ランキングと
       応援ユーザーランキングを別のURL（view=target／view=user）に分けている（画面スペースの都合）。 -->
  <div id="battleCard" class="card">
    <h2>対抗戦用（2つの試合をペアにした対抗戦）</h2>
    <label for="battleSelect">対抗戦</label>
    <select id="battleSelect"></select>

    <div style="margin-top: 16px;">
      <button id="battleConfirmBtn" class="primary hidden">両チーム順位確定</button>
    </div>
    <div id="battleConfirmNote" class="triggered-at-note" style="margin-top: 10px;"></div>

    <label for="battleTopSelect" style="margin-top: 14px;">順位発表画面の表示件数（2つのURL共通）</label>
    <select id="battleTopSelect">
      <option value="10">上位10件（既定）</option>
      <option value="20">上位20件（&amp;top=20）</option>
    </select>
    <label>順位発表画面URL：推し選手ランキング</label>
    <div class="screen-url-row">
      <input id="battleTargetUrlInput" type="text" readonly>
      <button type="button" id="battleTargetCopyBtn">コピー</button>
    </div>
    <label>順位発表画面URL：応援ユーザーランキング</label>
    <div class="screen-url-row">
      <input id="battleUserUrlInput" type="text" readonly>
      <button type="button" id="battleUserCopyBtn">コピー</button>
    </div>
  </div>

  <div class="card">
    <h2>単独イベント用：対象試合を選択（対抗戦を組まない試合）</h2>
    <label for="eventSelect">試合</label>
    <select id="eventSelect"></select>

    <div style="margin-top: 16px;">
      <button id="confirmBtn" class="primary hidden">順位確定</button>
    </div>
  </div>

  <div id="screenUrlCard" class="card hidden">
    <h2>単独イベント用：会場スクリーンURL</h2>
    <label>ユーザー別</label>
    <div class="screen-url-row">
      <input id="userScreenUrlInput" type="text" readonly>
      <button type="button" id="userScreenCopyBtn">コピー</button>
    </div>
    <label>選手・推し対象別</label>
    <div class="screen-url-row">
      <input id="targetScreenUrlInput" type="text" readonly>
      <button type="button" id="targetScreenCopyBtn">コピー</button>
    </div>
  </div>

  <div id="resultCard" class="card hidden">
    <h2>単独イベント用：確定結果</h2>
    <div id="triggeredAtNote" class="triggered-at-note"></div>

    <h3>ユーザー別（上位20件）</h3>
    <table>
      <thead>
        <tr><th>順位</th><th>ニックネーム</th><th>応援量</th></tr>
      </thead>
      <tbody id="userRankingBody"></tbody>
    </table>

    <h3>選手・推し対象別（上位20件）</h3>
    <table>
      <thead>
        <tr><th>順位</th><th>選手・推し対象</th><th>応援量</th></tr>
      </thead>
      <tbody id="targetRankingBody"></tbody>
    </table>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  const eventSelect = document.getElementById('eventSelect');
  const confirmBtn = document.getElementById('confirmBtn');
  const screenUrlCard = document.getElementById('screenUrlCard');
  const userScreenUrlInput = document.getElementById('userScreenUrlInput');
  const targetScreenUrlInput = document.getElementById('targetScreenUrlInput');
  const resultCard = document.getElementById('resultCard');
  const triggeredAtNote = document.getElementById('triggeredAtNote');
  const userRankingBody = document.getElementById('userRankingBody');
  const targetRankingBody = document.getElementById('targetRankingBody');

  const STATUS_LABELS = {
    live: 'live',
    paused: 'paused',
    scheduled: 'scheduled',
    finished: 'finished',
    cancelled: 'cancelled',
  };

  // events.htmlのactionButtonsFor()と同じ規約：live/paused/finishedのときのみ
  // 「順位確定」ボタンを描画する（scheduled/cancelledではグレーアウトやエラー表示を
  // せず、ボタン自体を描画しない）。
  const RANKING_ELIGIBLE_STATUSES = ['live', 'paused', 'finished'];

  let lastEventsList = [];

  function selectedEvent() {
    return lastEventsList.find((ev) => ev.id === eventSelect.value) || null;
  }

  function updateButtonVisibility() {
    const event = selectedEvent();
    if (event && RANKING_ELIGIBLE_STATUSES.includes(event.status)) {
      confirmBtn.classList.remove('hidden');
    } else {
      confirmBtn.classList.add('hidden');
    }
  }

  // 会場スクリーンURL（ranking-user.html/ranking-target.html）は、試合のstatusに
  // かかわらず、試合が選択されていれば常に表示する（順位確定前でも、確定操作前に
  // スクリーン側を先に開いておく運用を想定。スクリーン側は未確定時「まだ順位が
  // 確定していません」を表示するため支障は無い）。
  function updateScreenUrls() {
    const event = selectedEvent();
    if (!event) {
      screenUrlCard.classList.add('hidden');
      return;
    }
    userScreenUrlInput.value = `${APP_BASE}/ranking-user.html?event_id=${event.id}`;
    targetScreenUrlInput.value = `${APP_BASE}/ranking-target.html?event_id=${event.id}`;
    screenUrlCard.classList.remove('hidden');
  }

  async function copyToClipboard(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
      const original = btn.textContent;
      btn.textContent = 'コピーしました';
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch (err) {
      // クリップボードAPIが使えない環境（非HTTPS等）向けのフォールバック
      window.prompt('以下のURLを手動でコピーしてください', text);
    }
  }

  document.getElementById('userScreenCopyBtn').addEventListener('click', (e) => {
    copyToClipboard(userScreenUrlInput.value, e.target);
  });
  document.getElementById('targetScreenCopyBtn').addEventListener('click', (e) => {
    copyToClipboard(targetScreenUrlInput.value, e.target);
  });

  function populateEventSelect(events) {
    const prevValue = eventSelect.value;
    eventSelect.innerHTML = '';

    if (events.length === 0) {
      eventSelect.innerHTML = '<option value="">(登録されている試合はありません)</option>';
      updateButtonVisibility();
      updateScreenUrls();
      return;
    }

    events.forEach((ev) => {
      const opt = document.createElement('option');
      opt.value = ev.id;
      opt.textContent = `${ev.title}（${ev.organization_name || 'チーム未設定'}・${STATUS_LABELS[ev.status] || ev.status}）`;
      eventSelect.appendChild(opt);
    });
    if (events.some((ev) => ev.id === prevValue)) {
      eventSelect.value = prevValue;
    }
    updateButtonVisibility();
    updateScreenUrls();
  }

  eventSelect.addEventListener('change', () => {
    updateButtonVisibility();
    updateScreenUrls();
  });

  function renderRankingTable(tbodyEl, entries) {
    tbodyEl.innerHTML = '';
    if (entries.length === 0) {
      tbodyEl.innerHTML = '<tr class="empty-row"><td colspan="3">応援ログがありません</td></tr>';
      return;
    }
    entries.forEach((entry) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(entry.rank)}</td>
        <td>${escapeHtml(entry.display_name)}</td>
        <td>${escapeHtml(entry.cheer_value.toLocaleString('ja-JP'))}</td>
      `;
      tbodyEl.appendChild(tr);
    });
  }

  confirmBtn.addEventListener('click', async () => {
    const event = selectedEvent();
    if (!event) return;

    confirmBtn.disabled = true;
    try {
      const result = await apiFetch(`/events/${event.id}/ranking-snapshot`, { method: 'POST' });
      clearError();
      triggeredAtNote.textContent = `確定日時: ${new Date(result.triggeredAt).toLocaleString('ja-JP')}`;
      renderRankingTable(userRankingBody, result.userEntries);
      renderRankingTable(targetRankingBody, result.targetEntries);
      resultCard.classList.remove('hidden');
    } catch (e) {
      if (e.status === 400 && e.body && e.body.error === 'INVALID_EVENT_STATUS') {
        showError('この試合の現在の状態では順位確定できません（live/paused/finishedのときのみ実行できます）');
      } else if (e.status === 404 && e.body && e.body.error === 'EVENT_NOT_FOUND') {
        showError('試合が見つかりません（削除された可能性があります）');
      } else {
        showError('順位確定に失敗しました: ' + e.message);
      }
    } finally {
      confirmBtn.disabled = false;
    }
  });

  async function loadEvents() {
    try {
      const events = await apiFetch('/events');
      lastEventsList = events;
      populateEventSelect(events);
      clearError();
    } catch (e) {
      showError('試合一覧の取得に失敗しました: ' + e.message);
    }
  }

  // --- 対抗戦用：両チーム順位確定＋順位発表画面URL（推し選手・応援ユーザーは別URL） ------------------------
  const battleSelect = document.getElementById('battleSelect');
  const battleConfirmBtn = document.getElementById('battleConfirmBtn');
  const battleConfirmNote = document.getElementById('battleConfirmNote');
  const battleTopSelect = document.getElementById('battleTopSelect');
  const battleTargetUrlInput = document.getElementById('battleTargetUrlInput');
  const battleUserUrlInput = document.getElementById('battleUserUrlInput');

  let lastBattles = [];

  function selectedBattle() {
    return lastBattles.find((b) => b.id === battleSelect.value) || null;
  }

  function updateBattleControls() {
    const battle = selectedBattle();
    if (!battle) {
      battleConfirmBtn.classList.add('hidden');
      battleTargetUrlInput.value = '';
      battleUserUrlInput.value = '';
      return;
    }
    // 片方の試合がscheduled/cancelledでも、もう片方は確定できる（結果は下の通知で個別に表示する）。
    const eligible = RANKING_ELIGIBLE_STATUSES.includes(battle.event_a_status) ||
      RANKING_ELIGIBLE_STATUSES.includes(battle.event_b_status);
    battleConfirmBtn.classList.toggle('hidden', !eligible);
    // 既定（10件）は&topを付けない（画面側の既定と一致）。
    const topSuffix = battleTopSelect.value === '20' ? '&top=20' : '';
    // 推し選手ランキング（view=target）と応援ユーザーランキング（view=user）は別のURL。
    const base = `${APP_BASE}/ranking-battle.html?battle_id=${battle.id}`;
    battleTargetUrlInput.value = `${base}&view=target${topSuffix}`;
    battleUserUrlInput.value = `${base}&view=user${topSuffix}`;
  }

  function populateBattleSelect(battles) {
    const prevValue = battleSelect.value;
    battleSelect.innerHTML = '';
    if (battles.length === 0) {
      battleSelect.innerHTML = '<option value="">(登録されている対抗戦はありません)</option>';
      updateBattleControls();
      return;
    }
    battles.forEach((b) => {
      const opt = document.createElement('option');
      opt.value = b.id;
      const orgA = b.event_a_organization_name || b.event_a_title;
      const orgB = b.event_b_organization_name || b.event_b_title;
      opt.textContent = `${b.label ? b.label + '：' : ''}${orgA} vs ${orgB}`;
      battleSelect.appendChild(opt);
    });
    if (battles.some((b) => b.id === prevValue)) {
      battleSelect.value = prevValue;
    }
    updateBattleControls();
  }

  async function loadBattles() {
    try {
      lastBattles = await apiFetch('/event-battles');
      populateBattleSelect(lastBattles);
    } catch (e) {
      showError('対抗戦一覧の取得に失敗しました: ' + e.message);
    }
  }

  battleSelect.addEventListener('change', updateBattleControls);
  battleTopSelect.addEventListener('change', updateBattleControls);
  document.getElementById('battleTargetCopyBtn').addEventListener('click', (e) => {
    copyToClipboard(battleTargetUrlInput.value, e.target);
  });
  document.getElementById('battleUserCopyBtn').addEventListener('click', (e) => {
    copyToClipboard(battleUserUrlInput.value, e.target);
  });

  function describeBattleConfirmError(e) {
    if (e.status === 400 && e.body && e.body.error === 'INVALID_EVENT_STATUS') {
      return '現在の状態では確定できません（live/paused/finishedのときのみ）';
    }
    if (e.status === 404) return '試合が見つかりません';
    return '失敗: ' + e.message;
  }

  battleConfirmBtn.addEventListener('click', async () => {
    const battle = selectedBattle();
    if (!battle) return;

    battleConfirmBtn.disabled = true;
    battleConfirmNote.textContent = '確定中…';
    try {
      // A・Bを同時に呼び、2チームの確定時刻のずれを最小にする（それぞれ独立したスナップショット）。
      const targets = [
        { label: `チームA（${battle.event_a_organization_name || battle.event_a_title}）`, eventId: battle.event_a_id },
        { label: `チームB（${battle.event_b_organization_name || battle.event_b_title}）`, eventId: battle.event_b_id },
      ];
      const results = await Promise.allSettled(
        targets.map((t) => apiFetch(`/events/${t.eventId}/ranking-snapshot`, { method: 'POST' }))
      );
      const lines = results.map((r, idx) => {
        if (r.status === 'fulfilled') {
          return `${targets[idx].label}: 確定しました（${new Date(r.value.triggeredAt).toLocaleString('ja-JP')}）`;
        }
        return `${targets[idx].label}: ${describeBattleConfirmError(r.reason)}`;
      });
      battleConfirmNote.textContent = lines.join(' ／ ');
      if (results.some((r) => r.status === 'rejected')) {
        showError('一部のチームで順位確定に失敗しました。詳細は「対抗戦用」欄の表示を確認してください。');
      } else {
        clearError();
      }
    } finally {
      battleConfirmBtn.disabled = false;
    }
  });

  loadEvents();
  loadBattles();

  // events.html同様、bfcache復元時にも試合一覧を最新化する（pageshow対応）。
  window.addEventListener('pageshow', () => {
    loadEvents();
    loadBattles();
  });
})();
</script>
</body>
</html>
