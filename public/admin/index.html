<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試合管理 | 推しフル管理画面</title>
<style>
  :root {
    --bg: #0b0f14;
    --card-bg: #161b22;
    --border: #2a323d;
    --text: #f4f6f8;
    --text-muted: #9aa4af;
    --accent: #4d8dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px 16px 60px;
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  h2 { font-size: 15px; color: var(--text-muted); margin: 0 0 12px; }

  .error-bar {
    display: none;
    position: sticky;
    top: 0;
    z-index: 20;
    background: #b3261e;
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .error-bar.visible { display: block; }

  .container { max-width: 900px; margin: 0 auto; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  /* (A) 記録状態バナー */
  .record-banner {
    text-align: center;
    padding: 28px 16px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .record-banner.live {
    background: #1b3a24;
    border: 1px solid #2e7d46;
  }
  .record-banner.stopped {
    background: #2a2f36;
    border: 1px solid var(--border);
  }
  .record-banner .headline {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .record-banner.live .headline { color: #4ade80; }
  .record-banner.stopped .headline { color: var(--text-muted); }
  .record-banner .detail { font-size: 15px; color: var(--text); }
  .record-banner .note { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--text-muted); font-weight: normal; font-size: 12px; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    color: #0b0f14;
  }
  .badge.live { background: #4ade80; }
  .badge.paused { background: #facc15; }
  .badge.scheduled { background: #9aa4af; }
  .badge.finished { background: #60a5fa; }
  .badge.cancelled { background: #f87171; }

  button {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #1f2733;
    color: var(--text);
    cursor: pointer;
    margin-right: 4px;
    margin-bottom: 4px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: #b3261e; border-color: #b3261e; color: #fff; }

  label { display: block; font-size: 13px; color: var(--text-muted); margin: 10px 0 4px; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0f141b;
    color: var(--text);
    font-size: 14px;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 16px;
  }
  .modal-overlay.visible { display: flex; }
  .modal-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
  }
  .modal-box .actions { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }

  .empty-row td { color: var(--text-muted); text-align: center; padding: 20px; }

  /* デバイス管理（B-5、2026-08-19追加） */
  .device-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }
  .device-toolbar input[type="text"],
  .device-toolbar select { width: auto; flex: 1 1 160px; margin: 0; }
  .device-toolbar input[type="file"] { flex: 1 1 220px; }
  .device-toolbar label { margin: 0; }
  .import-result { font-size: 13px; color: var(--text-muted); margin: -4px 0 12px; }
  .device-pagination {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-muted);
  }
  td.checkbox-cell, th.checkbox-cell { width: 32px; }
  td.checkbox-cell input, th.checkbox-cell input { width: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>試合管理</h1>
  <div id="errorBar" class="error-bar"></div>

  <!-- (A) 現在の記録状態 -->
  <div id="recordBanner" class="record-banner stopped">
    <div class="headline">■ 記録停止中</div>
    <div class="note">応援データは保存されません</div>
  </div>

  <!-- (C) 新規登録フォーム -->
  <div class="card">
    <h2>新規試合登録</h2>
    <form id="createForm">
      <label for="createTitle">試合名</label>
      <input id="createTitle" type="text" required>

      <label for="createOrg">チーム</label>
      <select id="createOrg" required></select>

      <label for="createStartsAt">開始日時</label>
      <input id="createStartsAt" type="datetime-local" required>

      <label for="createEndsAt">終了日時（任意）</label>
      <input id="createEndsAt" type="datetime-local">

      <div style="margin-top: 16px;">
        <button type="submit" class="primary">登録</button>
      </div>
    </form>
  </div>

  <!-- (B) 試合一覧 -->
  <div class="card">
    <h2>試合一覧</h2>
    <table>
      <thead>
        <tr>
          <th>試合名</th>
          <th>チーム</th>
          <th>開始日時</th>
          <th>状態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="eventsTableBody">
        <tr class="empty-row"><td colspan="5">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- (F) チーム管理（B-4、2026-08-19追加） -->
  <div class="card">
    <h2>チーム新規登録</h2>
    <form id="orgCreateForm">
      <label for="orgCreateName">チーム名</label>
      <input id="orgCreateName" type="text" required>

      <label for="orgCreateCategory">ジャンル</label>
      <select id="orgCreateCategory" required></select>

      <label for="orgCreateLogoUrl">ロゴURL（任意）</label>
      <input id="orgCreateLogoUrl" type="text" placeholder="https://app.cheerstick.com/images/teams/...">

      <div style="margin-top: 16px;">
        <button type="submit" class="primary">登録</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>チーム一覧</h2>
    <div class="device-toolbar">
      <select id="orgCategoryFilter"></select>
    </div>
    <table>
      <thead>
        <tr>
          <th>チーム名</th>
          <th>ジャンル</th>
          <th>状態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="organizationsTableBody">
        <tr class="empty-row"><td colspan="4">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- (E) デバイス管理（B-5、2026-08-19追加） -->
  <div class="card">
    <h2>デバイス管理</h2>

    <div class="device-toolbar">
      <input id="deviceMacSearch" type="text" placeholder="MACアドレスで検索（部分一致）">
      <select id="deviceCategoryFilter"></select>
      <button id="deviceSearchBtn">検索</button>
    </div>

    <div class="device-toolbar">
      <label for="deviceCsvFile">CSV取り込み（1列目にMACアドレス。ヘッダー行の有無どちらでも可）</label>
      <input id="deviceCsvFile" type="file" accept=".csv,text/csv,text/plain">
      <button id="deviceImportBtn">取り込む</button>
    </div>
    <div id="deviceImportResult" class="import-result"></div>

    <form id="deviceCreateForm" class="device-toolbar">
      <input id="deviceCreateMac" type="text" placeholder="MACアドレス（単体登録）" required>
      <select id="deviceCreateCategory"></select>
      <label><input id="deviceCreateIsDemo" type="checkbox"> デモ機</label>
      <button type="submit">単体登録</button>
    </form>

    <div class="device-toolbar">
      <span id="deviceSelectedCount">0件選択中</span>
      <select id="deviceBulkCategory"></select>
      <select id="deviceBulkIsDemo">
        <option value="">デモ機フラグを変更しない</option>
        <option value="true">デモ機にする</option>
        <option value="false">デモ機を解除</option>
      </select>
      <button id="deviceBulkApplyBtn">選択した件に適用</button>
      <button id="deviceBulkApplyAllBtn">絞り込み条件に一致する全件に適用</button>
    </div>

    <table>
      <thead>
        <tr>
          <th class="checkbox-cell"><input id="deviceSelectAllCheckbox" type="checkbox"></th>
          <th>MACアドレス</th>
          <th>ジャンル</th>
          <th>デモ機</th>
          <th>登録日</th>
        </tr>
      </thead>
      <tbody id="devicesTableBody">
        <tr class="empty-row"><td colspan="5">読み込み中...</td></tr>
      </tbody>
    </table>

    <div class="device-pagination">
      <button id="devicePrevBtn">前へ</button>
      <span id="devicePageInfo"></span>
      <button id="deviceNextBtn">次へ</button>
    </div>
  </div>
</div>

<!-- (D) 編集モーダル -->
<div id="editModalOverlay" class="modal-overlay">
  <div class="modal-box">
    <h2>試合を編集</h2>
    <form id="editForm">
      <input type="hidden" id="editId">
      <label for="editTitle">試合名</label>
      <input id="editTitle" type="text" required>

      <label for="editOrg">チーム</label>
      <select id="editOrg" required></select>

      <label for="editStartsAt">開始日時</label>
      <input id="editStartsAt" type="datetime-local" required>

      <label for="editEndsAt">終了日時（任意）</label>
      <input id="editEndsAt" type="datetime-local">

      <div class="actions">
        <button type="button" id="editCancelBtn">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- (F) チーム編集モーダル（B-4、2026-08-19追加） -->
<div id="orgEditModalOverlay" class="modal-overlay">
  <div class="modal-box">
    <h2>チームを編集</h2>
    <form id="orgEditForm">
      <input type="hidden" id="orgEditId">
      <label for="orgEditName">チーム名</label>
      <input id="orgEditName" type="text" required>

      <label for="orgEditCategory">ジャンル</label>
      <select id="orgEditCategory" required></select>

      <label for="orgEditLogoUrl">ロゴURL（任意）</label>
      <input id="orgEditLogoUrl" type="text">

      <div class="actions">
        <button type="button" id="orgEditCancelBtn">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? '/api/v1/admin'
    : 'https://api.cheerstick.com/api/v1/admin';

  const errorBar = document.getElementById('errorBar');
  const recordBanner = document.getElementById('recordBanner');
  const eventsTableBody = document.getElementById('eventsTableBody');

  const createForm = document.getElementById('createForm');
  const createOrg = document.getElementById('createOrg');

  const editModalOverlay = document.getElementById('editModalOverlay');
  const editForm = document.getElementById('editForm');
  const editOrg = document.getElementById('editOrg');
  const editCancelBtn = document.getElementById('editCancelBtn');

  const STATUS_LABELS = {
    live: 'live',
    paused: 'paused',
    scheduled: 'scheduled',
    finished: 'finished',
    cancelled: 'cancelled',
  };

  function showError(message) {
    errorBar.textContent = message;
    errorBar.classList.add('visible');
  }

  function clearError() {
    errorBar.textContent = '';
    errorBar.classList.remove('visible');
  }

  // datetime-local (ローカル壁時計時刻) <-> ISO文字列(UTC) の変換。
  // Dateコンストラクタは "YYYY-MM-DDTHH:mm" 形式をローカル時刻として解釈するため、
  // toISOString()でそのままUTCへ変換すればタイムゾーンのずれは起きない。
  function datetimeLocalToIso(value) {
    if (!value) return null;
    return new Date(value).toISOString();
  }

  // サーバーから返るISO文字列を、datetime-local入力欄用の表示形式に変換する。
  // ローカルのgetter（getHours等）を使い、ブラウザのローカル時刻表現に揃える。
  function isoToDatetimeLocal(value) {
    if (!value) return '';
    const d = new Date(value);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function formatDisplayDate(value) {
    if (!value) return '';
    return new Date(value).toLocaleString('ja-JP', {
      year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
    });
  }

  async function apiFetch(path, options) {
    let res;
    try {
      res = await fetch(API_BASE + path, options);
    } catch (e) {
      showError('サーバーに接続できませんでした: ' + e.message);
      throw e;
    }

    let body = null;
    try {
      body = await res.json();
    } catch (e) {
      // レスポンスボディが無い場合もある
    }

    if (!res.ok) {
      const err = new Error((body && body.error) || `HTTP ${res.status}`);
      err.status = res.status;
      err.body = body;
      throw err;
    }
    return body;
  }

  function populateOrgSelect(selectEl, organizations) {
    selectEl.innerHTML = '';
    organizations.forEach((org) => {
      const opt = document.createElement('option');
      opt.value = org.id;
      opt.textContent = org.name;
      selectEl.appendChild(opt);
    });
  }

  function renderBanner(events) {
    const liveEvents = events.filter((e) => e.status === 'live');

    if (liveEvents.length > 0) {
      recordBanner.className = 'record-banner live';
      recordBanner.innerHTML =
        '<div class="headline">● 記録中</div>' +
        liveEvents.map((e) => `<div class="detail">${escapeHtml(e.title)}</div>`).join('');
    } else {
      recordBanner.className = 'record-banner stopped';
      recordBanner.innerHTML =
        '<div class="headline">■ 記録停止中</div>' +
        '<div class="note">応援データは保存されません</div>';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function actionButtonsFor(event) {
    const buttons = [];
    const finishConfirm = `「${event.title}」を終了します。この操作は取り消せません。よろしいですか？`;

    if (event.status === 'scheduled') {
      buttons.push({ label: '開始', nextStatus: 'live', confirm: false });
    } else if (event.status === 'live') {
      buttons.push({ label: '停止', nextStatus: 'paused', confirm: false });
      buttons.push({ label: '終了', nextStatus: 'finished', confirm: true, confirmMessage: finishConfirm });
    } else if (event.status === 'paused') {
      buttons.push({ label: '再開', nextStatus: 'live', confirm: false });
      buttons.push({ label: '終了', nextStatus: 'finished', confirm: true, confirmMessage: finishConfirm });
    } else if (event.status === 'finished') {
      // B-1（11.6、2026-08-19追加）：finishedからの復帰導線。戻り先はpausedのみ
      // （liveへ直接戻すとupdateEventStatusのLIVE_EVENT_CONFLICT検査を踏む経路があるため）。
      // ボタン文言は「再開」ではなく「終了を取り消す」＝誤操作の取り消しであることを伝える。
      buttons.push({
        label: '終了を取り消す',
        nextStatus: 'paused',
        confirm: true,
        confirmMessage: `「${event.title}」（現在：終了）の終了を取り消し、停止中に戻します。よろしいですか？`,
      });
    }
    return buttons;
  }

  function renderTable(events) {
    eventsTableBody.innerHTML = '';

    if (events.length === 0) {
      eventsTableBody.innerHTML = '<tr class="empty-row"><td colspan="5">登録されている試合はありません</td></tr>';
      return;
    }

    events.forEach((event) => {
      const tr = document.createElement('tr');

      const statusLabel = STATUS_LABELS[event.status] || event.status;

      tr.innerHTML = `
        <td>${escapeHtml(event.title)}</td>
        <td>${escapeHtml(event.organization_name || '-')}</td>
        <td>${escapeHtml(formatDisplayDate(event.starts_at))}</td>
        <td><span class="badge ${escapeHtml(event.status)}">${escapeHtml(statusLabel)}</span></td>
        <td class="action-cell"></td>
      `;

      const actionCell = tr.querySelector('.action-cell');

      actionButtonsFor(event).forEach((btnDef) => {
        const btn = document.createElement('button');
        btn.textContent = btnDef.label;
        if (btnDef.confirm) btn.classList.add('danger');
        btn.addEventListener('click', () => handleStatusChange(event, btnDef));
        actionCell.appendChild(btn);
      });

      const editBtn = document.createElement('button');
      editBtn.textContent = '編集';
      editBtn.addEventListener('click', () => openEditModal(event));
      actionCell.appendChild(editBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '削除';
      deleteBtn.classList.add('danger');
      deleteBtn.addEventListener('click', () => handleDelete(event));
      actionCell.appendChild(deleteBtn);

      eventsTableBody.appendChild(tr);
    });
  }

  async function handleStatusChange(event, btnDef) {
    if (btnDef.confirm) {
      const ok = confirm(btnDef.confirmMessage || `「${event.title}」の状態を変更します。よろしいですか？`);
      if (!ok) return;
    }

    try {
      await apiFetch(`/events/${event.id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: btnDef.nextStatus }),
      });
      clearError();
    } catch (e) {
      if (e.status === 409 && e.body) {
        const conflict = e.body.conflicting_event;
        alert(
          '既に同じチームでlive中の試合があるため開始できません。\n' +
          (conflict ? `該当試合: ${conflict.title}（id: ${conflict.id}）` : '')
        );
      } else {
        showError('状態の更新に失敗しました: ' + e.message);
      }
    } finally {
      await refreshAll();
    }
  }

  async function handleDelete(event) {
    const ok = confirm(`「${event.title}」を本当に削除しますか？`);
    if (!ok) return;

    try {
      await apiFetch(`/events/${event.id}`, { method: 'DELETE' });
      clearError();
    } catch (e) {
      if (e.status === 409 && e.body) {
        showError(e.body.message || '進行中の試合は削除できません。');
      } else {
        showError('試合の削除に失敗しました: ' + e.message);
      }
    } finally {
      await refreshAll();
    }
  }

  function openEditModal(event) {
    document.getElementById('editId').value = event.id;
    document.getElementById('editTitle').value = event.title;
    document.getElementById('editStartsAt').value = isoToDatetimeLocal(event.starts_at);
    document.getElementById('editEndsAt').value = isoToDatetimeLocal(event.ends_at);
    editOrg.value = event.organization_id;
    editModalOverlay.classList.add('visible');
  }

  function closeEditModal() {
    editModalOverlay.classList.remove('visible');
  }

  editCancelBtn.addEventListener('click', closeEditModal);

  editForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('editId').value;

    try {
      await apiFetch(`/events/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('editTitle').value.trim(),
          organization_id: editOrg.value,
          starts_at: datetimeLocalToIso(document.getElementById('editStartsAt').value),
          ends_at: datetimeLocalToIso(document.getElementById('editEndsAt').value),
        }),
      });
      clearError();
      closeEditModal();
    } catch (e2) {
      showError('試合の更新に失敗しました: ' + e2.message);
    } finally {
      await refreshAll();
    }
  });

  createForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    try {
      await apiFetch('/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('createTitle').value.trim(),
          organization_id: createOrg.value,
          starts_at: datetimeLocalToIso(document.getElementById('createStartsAt').value),
          ends_at: datetimeLocalToIso(document.getElementById('createEndsAt').value),
        }),
      });
      clearError();
      createForm.reset();
    } catch (e2) {
      showError('試合の登録に失敗しました: ' + e2.message);
    } finally {
      await refreshAll();
    }
  });

  async function loadOrganizations() {
    try {
      const organizations = await apiFetch('/organizations');
      populateOrgSelect(createOrg, organizations);
      populateOrgSelect(editOrg, organizations);
    } catch (e) {
      showError('チーム一覧の取得に失敗しました: ' + e.message);
    }
  }

  async function refreshAll() {
    try {
      const events = await apiFetch('/events');
      renderBanner(events);
      renderTable(events);
    } catch (e) {
      showError('試合一覧の取得に失敗しました: ' + e.message);
    }
  }

  loadOrganizations();
  refreshAll();

  // ==========================================================
  // (F) チーム（organizations）管理（B-4、2026-08-19追加）
  // ==========================================================
  const orgCreateForm = document.getElementById('orgCreateForm');
  const orgCreateCategory = document.getElementById('orgCreateCategory');
  const orgCreateLogoUrl = document.getElementById('orgCreateLogoUrl');
  const orgCategoryFilter = document.getElementById('orgCategoryFilter');
  const organizationsTableBody = document.getElementById('organizationsTableBody');
  const orgEditModalOverlay = document.getElementById('orgEditModalOverlay');
  const orgEditForm = document.getElementById('orgEditForm');
  const orgEditCategory = document.getElementById('orgEditCategory');
  const orgEditCancelBtn = document.getElementById('orgEditCancelBtn');

  async function loadOrgCategories() {
    try {
      const categories = await apiFetch('/categories');

      orgCreateCategory.innerHTML = '';
      orgCreateCategory.appendChild(new Option('選択してください', ''));
      categories.forEach((c) => orgCreateCategory.appendChild(new Option(c.name, c.id)));

      orgEditCategory.innerHTML = '';
      categories.forEach((c) => orgEditCategory.appendChild(new Option(c.name, c.id)));

      orgCategoryFilter.innerHTML = '';
      orgCategoryFilter.appendChild(new Option('すべてのジャンル', ''));
      categories.forEach((c) => orgCategoryFilter.appendChild(new Option(c.name, c.id)));
    } catch (e) {
      showError('ジャンル一覧の取得に失敗しました: ' + e.message);
    }
  }

  function renderOrganizationsTable(organizations) {
    organizationsTableBody.innerHTML = '';

    if (organizations.length === 0) {
      organizationsTableBody.innerHTML = '<tr class="empty-row"><td colspan="4">登録されているチームはありません</td></tr>';
      return;
    }

    organizations.forEach((org) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(org.name)}</td>
        <td>${escapeHtml(org.category_name || '未設定')}</td>
        <td>${org.is_active ? '有効' : '無効'}</td>
        <td class="action-cell"></td>
      `;

      const editBtn = document.createElement('button');
      editBtn.textContent = '編集';
      editBtn.addEventListener('click', () => openOrgEditModal(org));
      tr.querySelector('.action-cell').appendChild(editBtn);

      organizationsTableBody.appendChild(tr);
    });
  }

  async function loadOrganizationsList() {
    const categoryId = orgCategoryFilter.value;
    const params = new URLSearchParams();
    if (categoryId) params.set('category_id', categoryId);

    try {
      const organizations = await apiFetch('/organizations' + (params.toString() ? '?' + params.toString() : ''));
      renderOrganizationsTable(organizations);
      clearError();
    } catch (e) {
      showError('チーム一覧の取得に失敗しました: ' + e.message);
    }
  }

  orgCategoryFilter.addEventListener('change', loadOrganizationsList);

  orgCreateForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    try {
      await apiFetch('/organizations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('orgCreateName').value.trim(),
          category_id: orgCreateCategory.value,
          logo_url: orgCreateLogoUrl.value.trim() || null,
        }),
      });
      clearError();
      orgCreateForm.reset();
      await loadOrganizationsList();
      await loadOrganizations(); // 試合登録フォームのチームプルダウンも更新する
    } catch (e2) {
      showError('チームの登録に失敗しました: ' + e2.message);
    }
  });

  function openOrgEditModal(org) {
    document.getElementById('orgEditId').value = org.id;
    document.getElementById('orgEditName').value = org.name;
    document.getElementById('orgEditLogoUrl').value = org.logo_url || '';
    orgEditCategory.value = org.category_id || '';
    orgEditModalOverlay.classList.add('visible');
  }

  function closeOrgEditModal() {
    orgEditModalOverlay.classList.remove('visible');
  }

  orgEditCancelBtn.addEventListener('click', closeOrgEditModal);

  orgEditForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('orgEditId').value;

    try {
      await apiFetch(`/organizations/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('orgEditName').value.trim(),
          category_id: orgEditCategory.value,
          logo_url: document.getElementById('orgEditLogoUrl').value.trim() || null,
        }),
      });
      clearError();
      closeOrgEditModal();
      await loadOrganizationsList();
      await loadOrganizations();
    } catch (e2) {
      showError('チームの更新に失敗しました: ' + e2.message);
    }
  });

  loadOrgCategories();
  loadOrganizationsList();

  // ==========================================================
  // (E) デバイス管理（B-5、2026-08-19追加）
  // ==========================================================
  const deviceMacSearch = document.getElementById('deviceMacSearch');
  const deviceCategoryFilter = document.getElementById('deviceCategoryFilter');
  const deviceSearchBtn = document.getElementById('deviceSearchBtn');
  const deviceCsvFile = document.getElementById('deviceCsvFile');
  const deviceImportBtn = document.getElementById('deviceImportBtn');
  const deviceImportResult = document.getElementById('deviceImportResult');
  const deviceCreateForm = document.getElementById('deviceCreateForm');
  const deviceCreateCategory = document.getElementById('deviceCreateCategory');
  const deviceSelectedCount = document.getElementById('deviceSelectedCount');
  const deviceBulkCategory = document.getElementById('deviceBulkCategory');
  const deviceBulkIsDemo = document.getElementById('deviceBulkIsDemo');
  const deviceBulkApplyBtn = document.getElementById('deviceBulkApplyBtn');
  const deviceBulkApplyAllBtn = document.getElementById('deviceBulkApplyAllBtn');
  const devicesTableBody = document.getElementById('devicesTableBody');
  const deviceSelectAllCheckbox = document.getElementById('deviceSelectAllCheckbox');
  const devicePrevBtn = document.getElementById('devicePrevBtn');
  const deviceNextBtn = document.getElementById('deviceNextBtn');
  const devicePageInfo = document.getElementById('devicePageInfo');

  const DEVICE_PAGE_SIZE = 50;
  let devicePage = 1;
  let deviceTotal = 0;
  const selectedDeviceIds = new Set();

  function currentDeviceFilter() {
    const mac = deviceMacSearch.value.trim();
    const categoryParam = deviceCategoryFilter.value; // '' | 'null' | uuid
    return { mac: mac || null, categoryParam: categoryParam || null };
  }

  // カテゴリー（ジャンル）プルダウンを3画面分（一覧絞り込み／単体登録／一括設定）まとめて作る。
  // それぞれ先頭の固定選択肢の意味が異なるため、modeで出し分ける。
  function fillCategorySelect(selectEl, categories, mode) {
    selectEl.innerHTML = '';

    if (mode === 'filter') {
      selectEl.appendChild(new Option('すべてのジャンル', ''));
      selectEl.appendChild(new Option('未設定のみ', 'null'));
    } else if (mode === 'create') {
      selectEl.appendChild(new Option('ジャンル未設定', ''));
    } else if (mode === 'bulk') {
      selectEl.appendChild(new Option('ジャンルを変更しない', ''));
      selectEl.appendChild(new Option('未設定にする', '__unset__'));
    }

    categories.forEach((c) => {
      selectEl.appendChild(new Option(c.name, c.id));
    });
  }

  async function loadDeviceCategories() {
    try {
      const categories = await apiFetch('/categories');
      fillCategorySelect(deviceCategoryFilter, categories, 'filter');
      fillCategorySelect(deviceCreateCategory, categories, 'create');
      fillCategorySelect(deviceBulkCategory, categories, 'bulk');
    } catch (e) {
      showError('ジャンル一覧の取得に失敗しました: ' + e.message);
    }
  }

  function updateSelectedCount() {
    deviceSelectedCount.textContent = `${selectedDeviceIds.size}件選択中`;
  }

  function renderDevicesTable(devices) {
    devicesTableBody.innerHTML = '';

    if (devices.length === 0) {
      devicesTableBody.innerHTML = '<tr class="empty-row"><td colspan="5">該当するデバイスはありません</td></tr>';
      return;
    }

    devices.forEach((device) => {
      const tr = document.createElement('tr');

      tr.innerHTML = `
        <td class="checkbox-cell"><input type="checkbox" class="device-row-checkbox" data-id="${escapeHtml(device.id)}"></td>
        <td>${escapeHtml(device.mac_address)}</td>
        <td>${escapeHtml(device.category_name || '未設定')}</td>
        <td>${device.is_demo ? 'デモ機' : ''}</td>
        <td>${escapeHtml(formatDisplayDate(device.created_at))}</td>
      `;

      const checkbox = tr.querySelector('.device-row-checkbox');
      checkbox.checked = selectedDeviceIds.has(device.id);
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) selectedDeviceIds.add(device.id);
        else selectedDeviceIds.delete(device.id);
        updateSelectedCount();
      });

      devicesTableBody.appendChild(tr);
    });

    deviceSelectAllCheckbox.checked = false;
  }

  async function loadDevices() {
    const { mac, categoryParam } = currentDeviceFilter();
    const params = new URLSearchParams();
    if (mac) params.set('mac', mac);
    if (categoryParam) params.set('category_id', categoryParam);
    params.set('page', devicePage);
    params.set('page_size', DEVICE_PAGE_SIZE);

    try {
      const result = await apiFetch('/devices?' + params.toString());
      deviceTotal = result.total;
      renderDevicesTable(result.devices);
      const totalPages = Math.max(Math.ceil(deviceTotal / DEVICE_PAGE_SIZE), 1);
      devicePageInfo.textContent = `${devicePage} / ${totalPages}ページ（全${deviceTotal}件）`;
      devicePrevBtn.disabled = devicePage <= 1;
      deviceNextBtn.disabled = devicePage >= totalPages;
      clearError();
    } catch (e) {
      showError('デバイス一覧の取得に失敗しました: ' + e.message);
    }
  }

  deviceSearchBtn.addEventListener('click', () => {
    devicePage = 1;
    selectedDeviceIds.clear();
    updateSelectedCount();
    loadDevices();
  });

  devicePrevBtn.addEventListener('click', () => {
    if (devicePage > 1) {
      devicePage -= 1;
      loadDevices();
    }
  });

  deviceNextBtn.addEventListener('click', () => {
    devicePage += 1;
    loadDevices();
  });

  // 「全選択」は現在ページの表示行のみが対象（絞り込み条件に一致する全件は
  // 別ボタン「絞り込み条件に一致する全件に適用」で扱う。IDを送らないためページ数に上限が無い）。
  deviceSelectAllCheckbox.addEventListener('change', (e) => {
    devicesTableBody.querySelectorAll('.device-row-checkbox').forEach((cb) => {
      cb.checked = e.target.checked;
      const id = cb.getAttribute('data-id');
      if (e.target.checked) selectedDeviceIds.add(id);
      else selectedDeviceIds.delete(id);
    });
    updateSelectedCount();
  });

  function buildBulkFields() {
    const fields = {};
    if (deviceBulkCategory.value === '__unset__') {
      fields.category_id = null;
    } else if (deviceBulkCategory.value) {
      fields.category_id = deviceBulkCategory.value;
    }
    if (deviceBulkIsDemo.value === 'true') fields.is_demo = true;
    else if (deviceBulkIsDemo.value === 'false') fields.is_demo = false;
    return fields;
  }

  deviceBulkApplyBtn.addEventListener('click', async () => {
    const fields = buildBulkFields();
    if (Object.keys(fields).length === 0) {
      showError('ジャンルまたはデモ機フラグのいずれかを指定してください');
      return;
    }
    if (selectedDeviceIds.size === 0) {
      showError('デバイスを選択してください');
      return;
    }
    const ok = confirm(`選択した${selectedDeviceIds.size}件に適用します。よろしいですか？`);
    if (!ok) return;

    try {
      const result = await apiFetch('/devices/bulk', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [...selectedDeviceIds], ...fields }),
      });
      clearError();
      selectedDeviceIds.clear();
      updateSelectedCount();
      alert(`${result.updated}件を更新しました`);
      await loadDevices();
    } catch (e) {
      showError('一括更新に失敗しました: ' + e.message);
    }
  });

  deviceBulkApplyAllBtn.addEventListener('click', async () => {
    const fields = buildBulkFields();
    if (Object.keys(fields).length === 0) {
      showError('ジャンルまたはデモ機フラグのいずれかを指定してください');
      return;
    }
    const { mac, categoryParam } = currentDeviceFilter();
    if (!mac && !categoryParam) {
      showError('絞り込み条件（MAC検索またはジャンル）を指定してから実行してください（全件対象の誤操作防止）');
      return;
    }
    const ok = confirm(`現在の絞り込み条件に一致する全件（最大${deviceTotal}件）に適用します。よろしいですか？`);
    if (!ok) return;

    const filter = {};
    if (categoryParam === 'null') filter.category_id = null;
    else if (categoryParam) filter.category_id = categoryParam;
    if (mac) filter.mac = mac;

    try {
      const result = await apiFetch('/devices/bulk', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filter, ...fields }),
      });
      clearError();
      alert(`${result.updated}件を更新しました`);
      await loadDevices();
    } catch (e) {
      showError('一括更新に失敗しました: ' + e.message);
    }
  });

  deviceCreateForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const mac = document.getElementById('deviceCreateMac').value.trim();
    const categoryId = deviceCreateCategory.value || null;
    const isDemo = document.getElementById('deviceCreateIsDemo').checked;

    try {
      await apiFetch('/devices', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mac_address: mac, category_id: categoryId, is_demo: isDemo }),
      });
      clearError();
      deviceCreateForm.reset();
      await loadDevices();
    } catch (e2) {
      if (e2.status === 409) {
        showError('このMACアドレスは既に登録されています');
      } else if (e2.status === 400 && e2.body && e2.body.error === 'INVALID_MAC_ADDRESS') {
        showError('MACアドレスの形式が正しくありません');
      } else {
        showError('デバイスの登録に失敗しました: ' + e2.message);
      }
    }
  });

  deviceImportBtn.addEventListener('click', async () => {
    const file = deviceCsvFile.files[0];
    if (!file) {
      showError('CSVファイルを選択してください');
      return;
    }

    let text;
    try {
      text = await file.text();
    } catch (e) {
      showError('CSVファイルの読み込みに失敗しました: ' + e.message);
      return;
    }

    deviceImportBtn.disabled = true;
    deviceImportResult.textContent = '取り込み中...';

    try {
      const result = await apiFetch('/devices/import', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: text,
      });
      clearError();
      deviceImportResult.textContent =
        `取り込み結果：全${result.total_rows}行中、新規登録${result.inserted}件／` +
        `重複スキップ${result.duplicate_skipped}件／不正な形式${result.invalid_skipped}件` +
        (result.header_skipped ? '（1行目はヘッダー行として除外）' : '');
      deviceCsvFile.value = '';
      devicePage = 1;
      await loadDevices();
    } catch (e) {
      deviceImportResult.textContent = '';
      showError('CSV取り込みに失敗しました: ' + e.message);
    } finally {
      deviceImportBtn.disabled = false;
    }
  });

  loadDeviceCategories();
  updateSelectedCount();
  loadDevices();
})();
</script>
</body>
</html>
