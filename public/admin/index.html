<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 | 推しフル管理画面</title>
<link rel="stylesheet" href="tokens.css?v=20261028">
<link rel="stylesheet" href="shell.css?v=20261028b">
<link rel="stylesheet" href="ui.css?v=20261028">
<link rel="stylesheet" href="brand.css?v=20261028">
<style>
  /* ランチャー専用スタイル（2026-09-13新設、2026-10-27 UI刷新でトークン化）。 */
  .launcher-nav {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .launcher-nav a {
    display: block;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 20px;
    text-decoration: none;
    color: var(--color-text);
  }
  .launcher-nav a:hover { border-color: var(--color-accent); }
  .launcher-nav .nav-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
  .launcher-nav .nav-desc { font-size: 13px; color: var(--color-muted); }
</style>
</head>
<body data-page="index">
<script src="shell.js?v=20261028"></script>
<div class="container">
  <h1>ダッシュボード</h1>
  <p class="page-lead">試合の記録状態と、各管理機能への入口です。</p>
  <div id="errorBar" class="error-bar"></div>

  <!-- 記録状態バナー：旧index.html（試合管理・チーム管理・デバイス管理を1ページに
       同居させていた版）の(A)相当。2026-09-13の3ページ分割に伴い、ランチャーが
       独自にGET /eventsを取得して描画する（events.htmlの試合一覧とは別に、
       このページ単独で常に最新のlive状況を表示できるようにするため）。 -->
  <div id="recordBanner" class="record-banner stopped">
    <div class="headline">■ 記録停止中</div>
    <div class="note">応援データは保存されません</div>
  </div>

  <div class="launcher-nav">
    <a href="events.html">
      <div class="nav-title">試合管理</div>
      <div class="nav-desc">試合の登録・一覧・状態変更（開始/停止/終了）、対抗戦ペアの登録・一覧</div>
    </a>
    <a href="masters.html">
      <div class="nav-title">マスタ管理</div>
      <div class="nav-desc">チーム（組織）・デバイスの登録・一覧・編集</div>
    </a>
    <a href="targets.html">
      <div class="nav-title">選手・推し対象管理</div>
      <div class="nav-desc">選手・マスコット等（推し選択の対象）の登録・一覧・編集</div>
    </a>
    <a href="ranking-control.html">
      <div class="nav-title">順位確定</div>
      <div class="nav-desc">試合の順位を確定し、ユーザー別・選手別の上位20件を会場スクリーンへ反映</div>
    </a>
  </div>
</div>

<script src="common.js"></script>
<script>
(function () {
  const recordBanner = document.getElementById('recordBanner');

  function renderBanner(events) {
    if (window.AdminShell) window.AdminShell.setRecordStatus(events);
    const liveEvents = events.filter((e) => e.status === 'live');

    if (liveEvents.length > 0) {
      recordBanner.className = 'record-banner live';
      recordBanner.innerHTML =
        '<div class="headline">● 記録中</div>' +
        liveEvents.map((e) => `<div class="detail">${escapeHtml(e.title)}</div>`).join('');
    } else {
      recordBanner.className = 'record-banner stopped';
      recordBanner.innerHTML =
        '<div class="headline">■ 記録停止中</div>' +
        '<div class="note">応援データは保存されません</div>';
    }
  }

  async function loadBanner() {
    try {
      const events = await apiFetch('/events');
      renderBanner(events);
      clearError();
    } catch (e) {
      showError('試合一覧の取得に失敗しました: ' + e.message);
    }
  }

  loadBanner();
})();
</script>
</body>
</html>
