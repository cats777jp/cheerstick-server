<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CheerStick</title>
<style>
  :root {
    --team-color: rgb(0, 90, 170);
    --bg: #0b0f14;
    --card-bg: #161b22;
    --text: #f4f6f8;
    --text-muted: #9aa4af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  .status-bar {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .status-bar.error { color: #ff6b6b; }

  .team-logo {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    background: #fff;
    border: 3px solid var(--team-color);
    margin-bottom: 8px;
  }
  .team-name {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .card h1 {
    font-size: 18px;
    margin: 0 0 20px;
  }
  input[type="text"], input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a323c;
    background: #0b0f14;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 16px;
  }
  input[type="text"]:focus, input[type="email"]:focus {
    outline: none;
    border-color: var(--team-color);
  }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--team-color);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button:active:not(:disabled) { opacity: 0.85; }

  .welcome-name {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .welcome-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 24px;
  }

  .oshi-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #0b0f14;
    border: 1px solid #2a323c;
    border-radius: 12px;
    padding: 12px;
    text-align: left;
  }
  .oshi-photo, .avatar {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: cover;
    background: #222;
    flex-shrink: 0;
  }
  .avatar {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    color: #fff;
  }
  .oshi-name { font-size: 15px; font-weight: 600; margin: 0; }
  .oshi-position { font-size: 12px; color: var(--team-color); margin: 2px 0; }
  .oshi-data { font-size: 11px; color: var(--text-muted); margin: 0; }

  /* 選択リスト（チーム／選手） */
  .select-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 4px;
  }
  .select-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #0b0f14;
    border: 1px solid #2a323c;
    border-radius: 12px;
    padding: 12px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .select-item:hover, .select-item:active {
    border-color: var(--team-color);
  }
  .select-item .thumb {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    object-fit: cover;
    background: #fff;
    flex-shrink: 0;
  }
  .select-item .avatar { width: 48px; height: 48px; font-size: 16px; }
  .select-item .label { font-size: 14px; font-weight: 600; }
  .select-item .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .hidden { display: none !important; }

  /* ---------- 起動時スプラッシュ（接続確認〜ステータス判定） ---------- */
  #entrySplash {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    background: var(--bg);
    transition: opacity 0.4s ease;
  }
  #entrySplash.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .glow-capsule {
    width: 18px;
    height: 56px;
    border-radius: 9px;
    background: linear-gradient(180deg, var(--team-color), rgba(255, 255, 255, 0.05));
    box-shadow: 0 0 20px var(--team-color);
    animation: splashPulse 1.1s ease-in-out infinite;
  }
  @keyframes splashPulse {
    0%, 100% { opacity: 0.35; transform: scaleY(0.7); }
    50% { opacity: 1; transform: scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .glow-capsule { animation: none; opacity: 0.85; }
  }
  .splash-label {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .splash-error {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .splash-error.visible { display: flex; }
  .splash-error .error-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid #2a323c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--text-muted);
  }
  .splash-error .error-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }
  .splash-error .error-message {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 28em;
    margin: 0;
  }
  .splash-error .retry-button {
    margin-top: 4px;
    padding: 10px 24px;
    border-radius: 999px;
    border: 1px solid #2a323c;
    background: var(--card-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .splash-error .retry-button:active { opacity: 0.8; }
</style>
</head>
<body>

  <div id="entrySplash">
    <div id="splashConnecting">
      <div class="glow-capsule" aria-hidden="true"></div>
      <p class="splash-label" id="splashLabel">接続を確認しています…</p>
    </div>
    <div class="splash-error" id="splashError">
      <div class="error-icon" aria-hidden="true">!</div>
      <p class="error-title" id="splashErrorTitle">接続できませんでした</p>
      <p class="error-message" id="splashErrorMessage">通信状態をご確認のうえ、もう一度お試しください。</p>
      <button class="retry-button" id="splashRetryBtn" type="button">もう一度試す</button>
    </div>
  </div>

  <div id="statusBar" class="status-bar">接続中...</div>

  <img id="teamLogo" class="team-logo hidden" alt="team logo">
  <div id="teamName" class="team-name hidden"></div>

  <!-- 1. 未登録時：ニックネーム＋メールアドレス登録フォーム -->
  <div id="nameFormCard" class="card hidden">
    <h1>応援スティックへようこそ！<br>ニックネームとメールアドレスを登録してください</h1>
    <input type="text" id="nameInput" placeholder="ニックネーム" maxlength="20" autocomplete="nickname">
    <input type="email" id="emailInput" placeholder="メールアドレス" autocomplete="email">
    <p id="formError" class="status-bar error hidden" style="margin: -8px 0 12px;"></p>
    <button id="registerBtn">登録する</button>
  </div>

  <!-- 2. チーム選択画面 -->
  <div id="teamSelectCard" class="card hidden">
    <h1>応援するチームを選んでください</h1>
    <div id="teamList" class="select-list"></div>
  </div>

  <!-- 3. 選手（推し）選択画面 -->
  <div id="playerSelectCard" class="card hidden">
    <h1>推しを選んでください</h1>
    <div id="playerList" class="select-list"></div>
  </div>

  <!-- 4. 選択完了：ウェルカム画面 -->
  <div id="welcomeCard" class="card hidden">
    <p class="welcome-name" id="welcomeName"></p>
    <p class="welcome-sub">さん、応援ありがとうございます！</p>

    <div class="oshi-card">
      <img id="oshiPhoto" class="oshi-photo hidden" alt="推し">
      <div id="oshiAvatar" class="avatar hidden"></div>
      <div>
        <p class="oshi-name" id="oshiName"></p>
        <p class="oshi-position" id="oshiPosition"></p>
        <p class="oshi-data" id="oshiData"></p>
      </div>
    </div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const deviceId = params.get('id');

  const statusBar = document.getElementById('statusBar');
  const teamLogo = document.getElementById('teamLogo');
  const teamNameEl = document.getElementById('teamName');

  const entrySplash = document.getElementById('entrySplash');
  const splashConnecting = document.getElementById('splashConnecting');
  const splashLabel = document.getElementById('splashLabel');
  const splashError = document.getElementById('splashError');
  const splashErrorTitle = document.getElementById('splashErrorTitle');
  const splashErrorMessage = document.getElementById('splashErrorMessage');
  const splashRetryBtn = document.getElementById('splashRetryBtn');

  // まだ一度もカード（登録／チーム選択／推し選択／完了）を表示していない間は、
  // 通信エラー等をフルスクリーンのスプラッシュ上に表示する。
  // 一度でも表示した後は、既存のstatusBar（画面上部の小さなテキスト）で
  // 再接続状況を知らせる（今まで通りの挙動）。
  let hasShownContent = false;

  function showSplashConnecting(label) {
    entrySplash.classList.remove('fade-out');
    entrySplash.style.display = 'flex';
    splashError.classList.remove('visible');
    splashConnecting.style.display = 'flex';
    splashLabel.textContent = label || '接続を確認しています…';
  }

  function showSplashError(title, message) {
    entrySplash.classList.remove('fade-out');
    entrySplash.style.display = 'flex';
    splashConnecting.style.display = 'none';
    splashError.classList.add('visible');
    if (title) splashErrorTitle.textContent = title;
    if (message) splashErrorMessage.textContent = message;
  }

  function hideSplash() {
    entrySplash.classList.add('fade-out');
    window.setTimeout(() => { entrySplash.style.display = 'none'; }, 400);
  }

  const nameFormCard = document.getElementById('nameFormCard');
  const teamSelectCard = document.getElementById('teamSelectCard');
  const playerSelectCard = document.getElementById('playerSelectCard');
  const welcomeCard = document.getElementById('welcomeCard');

  const nameInput = document.getElementById('nameInput');
  const emailInput = document.getElementById('emailInput');
  const formError = document.getElementById('formError');
  const registerBtn = document.getElementById('registerBtn');

  const teamList = document.getElementById('teamList');
  const playerList = document.getElementById('playerList');

  const welcomeName = document.getElementById('welcomeName');
  const oshiPhoto = document.getElementById('oshiPhoto');
  const oshiAvatar = document.getElementById('oshiAvatar');
  const oshiName = document.getElementById('oshiName');
  const oshiPosition = document.getElementById('oshiPosition');
  const oshiData = document.getElementById('oshiData');

  const AVATAR_COLORS = ['#e63946', '#2a9d8f', '#e9c46a', '#8338ec', '#3a86ff', '#ff6b6b'];
  function colorFor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  if (!deviceId) {
    showSplashError('起動できませんでした', 'デバイス情報を取得できませんでした。アプリを再起動してください。');
    return;
  }

  // 本番は wss://ws.cheerstick.com/cheer 、ローカル確認時は同一ホストのws/wssを使う
  const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsHost = window.location.hostname === 'app.cheerstick.com'
    ? 'ws.cheerstick.com'
    : window.location.hostname; // ローカル/検証用フォールバック
  const wsUrl = `${wsProtocol}//${wsHost}/cheer`;

  let socket;
  let reconnectTimer = null;
  let reconnectAttempts = 0;

  // ランダム要素を含む再接続待機時間を計算する。
  // 同時多発切断（Wi-Fi/基地局の瞬断等）が起きた際、数百〜数千台が
  // 一斉に同じタイミングでリトライして負荷が集中する「リトライストーム」を
  // 避けるため、基準時間に±のばらつきを持たせ、失敗が続く場合は
  // 間隔を段階的に広げる（上限あり）。
  function nextReconnectDelay() {
    const base = Math.min(2000 * Math.pow(1.5, reconnectAttempts), 10000); // 2s → 最大10s
    const jitter = base * 0.5 * (Math.random() * 2 - 1); // ±50%のランダム幅
    return Math.max(1000, Math.round(base + jitter));
  }

  function connect() {
    if (!hasShownContent) {
      showSplashConnecting('接続を確認しています…');
    }
    statusBar.textContent = '接続中...';
    statusBar.classList.remove('error');
    socket = new WebSocket(wsUrl);

    socket.addEventListener('open', () => {
      reconnectAttempts = 0;
      statusBar.textContent = '';
      send({ type: 'connect', id: deviceId });
    });

    socket.addEventListener('message', (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (msg.type === 'connect') {
        renderConnect(msg);
      } else if (msg.type === 'error') {
        registerBtn.disabled = false;
        formError.textContent = msg.message;
        formError.classList.remove('hidden');
        statusBar.textContent = msg.message;
        statusBar.classList.add('error');
      }
    });

    socket.addEventListener('close', () => {
      if (!hasShownContent) {
        // 初回接続がまだ成立していない間は、無限リトライをスプラッシュの裏で
        // 繰り返すのではなく、状況を明示してユーザー操作でリトライさせる
        showSplashError('接続できませんでした', '通信状態をご確認のうえ、もう一度お試しください。');
        return;
      }
      statusBar.textContent = '接続が切れました。再接続しています...';
      statusBar.classList.add('error');
      const delay = nextReconnectDelay();
      reconnectAttempts += 1;
      reconnectTimer = setTimeout(connect, delay);
    });

    socket.addEventListener('error', () => {
      // close イベントが続けて発火し再接続処理が走る
    });
  }

  function send(payload) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify(payload));
    }
  }

  function hideAllCards() {
    [nameFormCard, teamSelectCard, playerSelectCard, welcomeCard].forEach((c) =>
      c.classList.add('hidden')
    );
  }

  function renderTeamList(teams) {
    teamList.innerHTML = '';
    teams.forEach((team) => {
      const item = document.createElement('div');
      item.className = 'select-item';
      item.innerHTML = `
        <img class="thumb" src="${team.logo_url || ''}" alt="">
        <div>
          <div class="label">${escapeHtml(team.name)}</div>
        </div>
      `;
      item.addEventListener('click', () => {
        send({ type: 'select_team', id: deviceId, organization_id: team.id });
      });
      teamList.appendChild(item);
    });
  }

  function renderPlayerList(targets) {
    playerList.innerHTML = '';
    targets.forEach((t) => {
      const item = document.createElement('div');
      item.className = 'select-item';

      const thumbHtml = t.image_url
        ? `<img class="thumb" src="${t.image_url}" alt="">`
        : `<div class="avatar" style="background:${colorFor(t.id)}">${escapeHtml((t.name || '?').charAt(0))}</div>`;

      const subLabel = t.type === 'mascot' ? 'マスコット' : (t.number ? `背番号 ${t.number}` : '');

      item.innerHTML = `
        ${thumbHtml}
        <div>
          <div class="label">${escapeHtml(t.name)}</div>
          <div class="sub">${escapeHtml(subLabel)}</div>
        </div>
      `;
      item.addEventListener('click', () => {
        send({ type: 'set_oshi', id: deviceId, target_id: t.id });
      });
      playerList.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function renderConnect(msg) {
    const { status, user, team, member, teams, targets, message } = msg;

    // category_id未設定デバイス等、そもそもカードを出せないケース。
    // 以前は分岐が無く画面が真っ黒になっていたため、ここで明示的にハンドリングする。
    if (status === 'error') {
      hideAllCards();
      showSplashError(
        'ご利用いただけません',
        message || 'サポートまでお問い合わせください。'
      );
      return;
    }

    if (!hasShownContent) {
      hasShownContent = true;
      hideSplash();
    }

    if (team) {
      teamLogo.src = team.logo_url;
      teamLogo.classList.remove('hidden');
      teamNameEl.textContent = team.name;
      teamNameEl.classList.remove('hidden');
    } else {
      teamLogo.classList.add('hidden');
      teamNameEl.classList.add('hidden');
    }

    hideAllCards();

    if (status === 'unregistered') {
      nameFormCard.classList.remove('hidden');
      registerBtn.disabled = false;
    } else if (status === 'team_selection') {
      teamSelectCard.classList.remove('hidden');
      renderTeamList(teams || []);
    } else if (status === 'player_selection') {
      playerSelectCard.classList.remove('hidden');
      renderPlayerList(targets || []);
    } else if (status === 'complete') {
      welcomeCard.classList.remove('hidden');
      welcomeName.textContent = user.name;

      if (member) {
        if (member.image_url) {
          oshiPhoto.src = member.image_url;
          oshiPhoto.classList.remove('hidden');
          oshiAvatar.classList.add('hidden');
        } else {
          oshiAvatar.textContent = (member.name || '?').charAt(0);
          oshiAvatar.style.background = colorFor(member.id);
          oshiAvatar.classList.remove('hidden');
          oshiPhoto.classList.add('hidden');
        }
        oshiName.textContent = member.name;
        oshiPosition.textContent =
          member.type === 'mascot' ? 'マスコット' : (member.number ? `背番号 ${member.number}` : (member.type || ''));
        oshiData.textContent = (member.metadata && member.metadata.description) || '';
      }
    }
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  registerBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    formError.classList.add('hidden');

    if (!name) {
      formError.textContent = 'ニックネームを入力してください';
      formError.classList.remove('hidden');
      return;
    }
    if (!isValidEmail(email)) {
      formError.textContent = 'メールアドレスの形式が正しくありません';
      formError.classList.remove('hidden');
      return;
    }

    registerBtn.disabled = true;
    send({ type: 'register', id: deviceId, name, email });
  });

  splashRetryBtn.addEventListener('click', () => {
    connect();
  });

  [nameInput, emailInput].forEach((el) => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') registerBtn.click();
    });
  });

  connect();
})();
</script>
</body>
</html>
