<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>推しフル</title>
<style>
  :root {
    --team-color: rgb(0, 90, 170);
    --bg: #0b0f14;
    --card-bg: #161b22;
    --text: #f4f6f8;
    --text-muted: #9aa4af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  .status-bar {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .status-bar.error { color: #ff6b6b; }

  .team-logo {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    object-fit: cover;
    background: #fff;
    border: 3px solid var(--team-color);
    margin-bottom: 8px;
  }
  #teamLogoAvatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 3px solid var(--team-color);
    margin-bottom: 8px;
    font-size: 28px;
  }
  .team-name {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .card h1 {
    font-size: 18px;
    margin: 0 0 20px;
  }
  input[type="text"], input[type="email"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a323c;
    background: #0b0f14;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 16px;
  }
  input[type="text"]:focus, input[type="email"]:focus {
    outline: none;
    border-color: var(--team-color);
  }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--team-color);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button:active:not(:disabled) { opacity: 0.85; }

  .welcome-name {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .welcome-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 24px;
  }

  .oshi-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #0b0f14;
    border: 1px solid #2a323c;
    border-radius: 12px;
    padding: 12px;
    text-align: left;
  }
  .oshi-photo, .avatar {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    object-fit: cover;
    background: #222;
    flex-shrink: 0;
  }
  .avatar {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    color: #fff;
  }
  .oshi-name { font-size: 15px; font-weight: 600; margin: 0; }
  .oshi-position { font-size: 12px; color: var(--team-color); margin: 2px 0; }
  .oshi-data { font-size: 11px; color: var(--text-muted); margin: 0; }

  /* 選択リスト（チーム／選手） */
  .select-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 4px;
  }
  .select-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #0b0f14;
    border: 1px solid #2a323c;
    border-radius: 12px;
    padding: 12px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .select-item:hover, .select-item:active {
    border-color: var(--team-color);
  }
  .select-item .thumb {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    object-fit: cover;
    background: #fff;
    flex-shrink: 0;
  }
  .select-item .avatar { width: 48px; height: 48px; font-size: 16px; }
  .select-item .label { font-size: 14px; font-weight: 600; }
  .select-item .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .hidden { display: none !important; }

  /* ---------- 起動時スプラッシュ（接続確認〜ステータス判定） ---------- */
  #entrySplash {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
    background: var(--bg);
    transition: opacity 0.4s ease;
  }
  #entrySplash.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .glow-capsule {
    width: 18px;
    height: 56px;
    border-radius: 9px;
    background: linear-gradient(180deg, var(--team-color), rgba(255, 255, 255, 0.05));
    box-shadow: 0 0 20px var(--team-color);
    animation: splashPulse 1.1s ease-in-out infinite;
  }
  @keyframes splashPulse {
    0%, 100% { opacity: 0.35; transform: scaleY(0.7); }
    50% { opacity: 1; transform: scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .glow-capsule { animation: none; opacity: 0.85; }
  }
  .splash-label {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .splash-error {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .splash-error.visible { display: flex; }
  .splash-error .error-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid #2a323c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--text-muted);
  }
  .splash-error .error-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }
  .splash-error .error-message {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 28em;
    margin: 0;
  }
  .splash-error .retry-button {
    margin-top: 4px;
    padding: 10px 24px;
    border-radius: 999px;
    border: 1px solid #2a323c;
    background: var(--card-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .splash-error .retry-button:active { opacity: 0.8; }

  /* ---------- 応援データ参照（完了画面に埋め込み表示） ---------- */
  .cheer-stats {
    margin-top: 20px;
  }
  .stats-heading {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin: 0 0 10px;
    text-align: left;
  }
  .cheer-stats .bars {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    background: #0b0f14;
    border: 1px solid #2a323c;
    border-radius: 12px;
    padding: 20px 14px 14px;
    margin-bottom: 20px;
  }
  .cheer-stats .bar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .cheer-stats .bar-track {
    width: 100%;
    height: 96px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .cheer-stats .bar-stick {
    width: 13px;
    border-radius: 7px;
    background: linear-gradient(180deg, var(--team-color), rgba(255, 255, 255, 0.15));
    box-shadow: 0 0 12px var(--team-color);
    position: relative;
    min-height: 6px;
  }
  .cheer-stats .bar-stick::after {
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--team-color);
    box-shadow: 0 0 14px 3px var(--team-color);
  }
  .cheer-stats .bar-value {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
  }
  .cheer-stats .bar-title {
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.3;
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cheer-stats .bar-date {
    font-size: 9.5px;
    color: var(--text-muted);
    opacity: 0.7;
  }
  .cheer-stats .bars-empty {
    width: 100%;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 16px 0;
  }
  .alltime-card {
    background: #0b0f14;
    border: 1px solid #2a323c;
    border-radius: 12px;
    padding: 16px 18px;
    text-align: left;
  }
  .alltime-number {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
  }
  .alltime-unit {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: 4px;
  }
  .alltime-meter {
    margin-top: 10px;
    height: 6px;
    border-radius: 3px;
    background: #1c232c;
    overflow: hidden;
  }
  .alltime-meter-fill {
    height: 100%;
    width: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.15), var(--team-color));
    box-shadow: 0 0 8px var(--team-color);
  }

  /* ---------- 応援中画面 ---------- */
  .cheer-count-display {
    font-size: 64px;
    font-weight: 700;
    color: var(--text);
    margin: 12px 0 20px;
  }
  .battery-display, .ble-alert-display {
    font-size: 13px;
    color: #ff6b6b;
    margin: 0 0 16px;
  }
</style>
</head>
<body>

  <div id="entrySplash">
    <div id="splashConnecting">
      <div class="glow-capsule" aria-hidden="true"></div>
      <p class="splash-label" id="splashLabel">接続を確認しています…</p>
    </div>
    <div class="splash-error" id="splashError">
      <div class="error-icon" aria-hidden="true">!</div>
      <p class="error-title" id="splashErrorTitle">接続できませんでした</p>
      <p class="error-message" id="splashErrorMessage">通信状態をご確認のうえ、もう一度お試しください。</p>
      <button class="retry-button" id="splashRetryBtn" type="button">もう一度試す</button>
    </div>
  </div>

  <div id="statusBar" class="status-bar">接続中...</div>

  <img id="teamLogo" class="team-logo hidden" alt="team logo">
  <div id="teamLogoAvatar" class="avatar hidden"></div>
  <div id="teamName" class="team-name hidden"></div>

  <!-- 1. 未登録時：ニックネーム＋メールアドレス登録フォーム -->
  <div id="nameFormCard" class="card hidden">
    <h1>「推しフル」へようこそ！<br>ニックネームとメールアドレスを登録してください</h1>
    <input type="text" id="nameInput" placeholder="ニックネーム" maxlength="20" autocomplete="nickname">
    <input type="email" id="emailInput" placeholder="メールアドレス" autocomplete="email">
    <p id="formError" class="status-bar error hidden" style="margin: -8px 0 12px;"></p>
    <button id="registerBtn">登録する</button>
  </div>

  <!-- 2. チーム選択画面 -->
  <div id="teamSelectCard" class="card hidden">
    <h1>応援するチームを選んでください</h1>
    <div id="teamList" class="select-list"></div>
  </div>

  <!-- 3. 選手（推し）選択画面 -->
  <div id="playerSelectCard" class="card hidden">
    <h1>推しを選んでください</h1>
    <div id="playerList" class="select-list"></div>
  </div>

  <!-- 4. 選択完了：ウェルカム画面 -->
  <div id="welcomeCard" class="card hidden">
    <p class="welcome-name" id="welcomeName"></p>
    <p class="welcome-sub">さん、応援ありがとうございます！</p>

    <div class="oshi-card">
      <img id="oshiPhoto" class="oshi-photo hidden" alt="推し">
      <div id="oshiAvatar" class="avatar hidden"></div>
      <div>
        <p class="oshi-name" id="oshiName"></p>
        <p class="oshi-position" id="oshiPosition"></p>
        <p class="oshi-data" id="oshiData"></p>
        <p class="oshi-data hidden" id="oshiProfileText"></p>
      </div>
    </div>

    <div id="cheerStatsSection" class="cheer-stats hidden">
      <h2 class="stats-heading">直近の応援</h2>
      <div class="bars" id="recentBars"></div>
      <h2 class="stats-heading">通算応援量</h2>
      <div class="alltime-card">
        <div>
          <span class="alltime-number" id="allTimeNumber">0</span>
          <span class="alltime-unit">応援強度・累計</span>
        </div>
        <div class="alltime-meter"><div class="alltime-meter-fill"></div></div>
      </div>
    </div>

    <button id="startCheeringBtn" style="margin-top: 20px;">START</button>
  </div>

  <!-- 5. 応援中画面 -->
  <div id="cheeringCard" class="card hidden">
    <h1>応援中</h1>
    <div class="cheer-count-display" id="cheerCountDisplay">0</div>
    <p class="battery-display hidden" id="batteryDisplay">電池残少</p>
    <p class="ble-alert-display hidden" id="bleAlertDisplay">接続が不安定です。再接続しています…</p>
    <button id="endCheeringBtn">応援を終了する</button>
  </div>

  <!-- 6. 応援終了画面 -->
  <div id="endedCard" class="card hidden">
    <h1>応援ありがとうございました</h1>
    <button id="resumeCheeringBtn" style="margin-top: 20px;">続きから応援する</button>
  </div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const deviceId = params.get('id');

  const statusBar = document.getElementById('statusBar');
  const teamLogo = document.getElementById('teamLogo');
  const teamLogoAvatar = document.getElementById('teamLogoAvatar');
  const teamNameEl = document.getElementById('teamName');

  const entrySplash = document.getElementById('entrySplash');
  const splashConnecting = document.getElementById('splashConnecting');
  const splashLabel = document.getElementById('splashLabel');
  const splashError = document.getElementById('splashError');
  const splashErrorTitle = document.getElementById('splashErrorTitle');
  const splashErrorMessage = document.getElementById('splashErrorMessage');
  const splashRetryBtn = document.getElementById('splashRetryBtn');

  // まだ一度もカード（登録／チーム選択／推し選択／完了）を表示していない間は、
  // 通信エラー等をフルスクリーンのスプラッシュ上に表示する。
  // 一度でも表示した後は、既存のstatusBar（画面上部の小さなテキスト）で
  // 再接続状況を知らせる（今まで通りの挙動）。
  let hasShownContent = false;

  // 応援中画面で表示中の累計カウント（画面表示用。サーバーへの送信は5回分ずつ）
  let matchCheerCount = 0;

  // CSSの --team-color 初期値（rgb(0, 90, 170)）と同じ色。teamにcolorが無い場合のフォールバック。
  const DEFAULT_TEAM_COLOR = '#005AAA';
  let currentTeamColor = DEFAULT_TEAM_COLOR;

  function showSplashConnecting(label) {
    entrySplash.classList.remove('fade-out');
    entrySplash.style.display = 'flex';
    splashError.classList.remove('visible');
    splashConnecting.style.display = 'flex';
    splashLabel.textContent = label || '接続を確認しています…';
  }

  function showSplashError(title, message) {
    entrySplash.classList.remove('fade-out');
    entrySplash.style.display = 'flex';
    splashConnecting.style.display = 'none';
    splashError.classList.add('visible');
    if (title) splashErrorTitle.textContent = title;
    if (message) splashErrorMessage.textContent = message;
  }

  function hideSplash() {
    entrySplash.classList.add('fade-out');
    window.setTimeout(() => { entrySplash.style.display = 'none'; }, 400);
  }

  const nameFormCard = document.getElementById('nameFormCard');
  const teamSelectCard = document.getElementById('teamSelectCard');
  const playerSelectCard = document.getElementById('playerSelectCard');
  const welcomeCard = document.getElementById('welcomeCard');
  const cheeringCard = document.getElementById('cheeringCard');
  const endedCard = document.getElementById('endedCard');
  const resumeCheeringBtn = document.getElementById('resumeCheeringBtn');

  const startCheeringBtn = document.getElementById('startCheeringBtn');
  const endCheeringBtn = document.getElementById('endCheeringBtn');
  const cheerCountDisplay = document.getElementById('cheerCountDisplay');
  const batteryDisplay = document.getElementById('batteryDisplay');
  const bleAlertDisplay = document.getElementById('bleAlertDisplay');

  const nameInput = document.getElementById('nameInput');
  const emailInput = document.getElementById('emailInput');
  const formError = document.getElementById('formError');
  const registerBtn = document.getElementById('registerBtn');

  const teamList = document.getElementById('teamList');
  const playerList = document.getElementById('playerList');

  const welcomeName = document.getElementById('welcomeName');
  const oshiPhoto = document.getElementById('oshiPhoto');
  const oshiAvatar = document.getElementById('oshiAvatar');
  const oshiName = document.getElementById('oshiName');
  const oshiPosition = document.getElementById('oshiPosition');
  const oshiData = document.getElementById('oshiData');
  const oshiProfileText = document.getElementById('oshiProfileText');

  const cheerStatsSection = document.getElementById('cheerStatsSection');
  const recentBars = document.getElementById('recentBars');
  const allTimeNumber = document.getElementById('allTimeNumber');

  // reference.htmlと同じAPI（api.cheerstick.comサブドメイン）
  const API_BASE = 'https://api.cheerstick.com';

  const AVATAR_COLORS = ['#e63946', '#2a9d8f', '#e9c46a', '#8338ec', '#3a86ff', '#ff6b6b'];
  function colorFor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  if (!deviceId) {
    showSplashError('起動できませんでした', 'デバイス情報を取得できませんでした。アプリを再起動してください。');
    return;
  }

  // 本番は wss://ws.cheerstick.com/cheer 、ローカル確認時は同一ホストのws/wssを使う
  const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsHost = window.location.hostname === 'app.cheerstick.com'
    ? 'ws.cheerstick.com'
    : window.location.hostname; // ローカル/検証用フォールバック
  const wsUrl = `${wsProtocol}//${wsHost}/cheer`;

  let socket;
  let reconnectTimer = null;
  let reconnectAttempts = 0;
  let cheerEnded = false; // 「応援を終了する」後は、再接続しても終了画面を維持する
  let intentionalClose = false; // 「応援を終了する」ボタン等での意図的な切断フラグ（再接続しない）

  // ランダム要素を含む再接続待機時間を計算する。
  // 同時多発切断（Wi-Fi/基地局の瞬断等）が起きた際、数百〜数千台が
  // 一斉に同じタイミングでリトライして負荷が集中する「リトライストーム」を
  // 避けるため、基準時間に±のばらつきを持たせ、失敗が続く場合は
  // 間隔を段階的に広げる（上限あり）。
  function nextReconnectDelay() {
    const base = Math.min(2000 * Math.pow(1.5, reconnectAttempts), 10000); // 2s → 最大10s
    const jitter = base * 0.5 * (Math.random() * 2 - 1); // ±50%のランダム幅
    return Math.max(1000, Math.round(base + jitter));
  }

  function connect() {
    if (!hasShownContent) {
      showSplashConnecting('接続を確認しています…');
    }
    statusBar.textContent = '接続中...';
    statusBar.classList.remove('error');
    socket = new WebSocket(wsUrl);

    socket.addEventListener('open', () => {
      reconnectAttempts = 0;
      statusBar.textContent = '';
      send({ type: 'connect', id: deviceId });
    });

    socket.addEventListener('message', (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (msg.type === 'connect') {
        renderConnect(msg);
      } else if (msg.type === 'error') {
        registerBtn.disabled = false;
        formError.textContent = msg.message;
        formError.classList.remove('hidden');
        statusBar.textContent = msg.message;
        statusBar.classList.add('error');
      }
    });

    socket.addEventListener('close', () => {
      if (intentionalClose) {
        // 「応援を終了する」ボタン等による意図的な切断。再接続はしない。
        return;
      }
      if (!hasShownContent) {
        // 初回接続がまだ成立していない間は、無限リトライをスプラッシュの裏で
        // 繰り返すのではなく、状況を明示してユーザー操作でリトライさせる
        showSplashError('接続できませんでした', '通信状態をご確認のうえ、もう一度お試しください。');
        return;
      }
      statusBar.textContent = '接続が切れました。再接続しています...';
      statusBar.classList.add('error');
      const delay = nextReconnectDelay();
      reconnectAttempts += 1;
      reconnectTimer = setTimeout(connect, delay);
    });

    socket.addEventListener('error', () => {
      // close イベントが続けて発火し再接続処理が走る
    });
  }

  function send(payload) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify(payload));
    }
  }

  function hideAllCards() {
    [nameFormCard, teamSelectCard, playerSelectCard, welcomeCard, cheeringCard, endedCard].forEach((c) =>
      c.classList.add('hidden')
    );
  }

  function renderTeamList(teams) {
    teamList.innerHTML = '';
    teams.forEach((team) => {
      const item = document.createElement('div');
      item.className = 'select-item';
      item.innerHTML = `
        <img class="thumb" src="${team.logo_url || ''}" alt="">
        <div>
          <div class="label">${escapeHtml(team.name)}</div>
        </div>
      `;
      item.addEventListener('click', () => {
        send({ type: 'select_team', id: deviceId, organization_id: team.id });
      });
      teamList.appendChild(item);
    });
  }

  function renderPlayerList(targets) {
    playerList.innerHTML = '';
    targets.forEach((t) => {
      const item = document.createElement('div');
      item.className = 'select-item';

      const thumbHtml = t.image_url
        ? `<img class="thumb" src="${t.image_url}" alt="">`
        : `<div class="avatar" style="background:${colorFor(t.id)}">${escapeHtml((t.name || '?').charAt(0))}</div>`;

      const subLabel = t.type === 'mascot' ? 'マスコット' : (t.number ? `背番号 ${t.number}` : '');

      item.innerHTML = `
        ${thumbHtml}
        <div>
          <div class="label">${escapeHtml(t.name)}</div>
          <div class="sub">${escapeHtml(subLabel)}</div>
        </div>
      `;
      item.addEventListener('click', () => {
        send({ type: 'set_oshi', id: deviceId, target_id: t.id });
      });
      playerList.appendChild(item);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function formatNumber(n) {
    return Number(n || 0).toLocaleString('ja-JP');
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return new Intl.DateTimeFormat('ja-JP', {
      month: 'numeric', day: 'numeric', weekday: 'short'
    }).format(d);
  }

  // reference_url（.../reference.html?token=xxx または ?id=xxx）から
  // token/idを取り出し、JSONを返すAPI（api.cheerstick.com側）を直接叩くための
  // クエリ文字列を組み立てる。tokenがあればtoken方式、なければid方式。
  function extractReferenceQuery(referenceUrl) {
    try {
      const u = new URL(referenceUrl);
      const token = u.searchParams.get('token');
      const id = u.searchParams.get('id');
      if (token) return 'token=' + encodeURIComponent(token);
      if (id) return 'id=' + encodeURIComponent(id);
      return null;
    } catch (e) {
      return null;
    }
  }

  function renderRecentBars(recentEvents) {
    recentBars.innerHTML = '';

    if (!recentEvents || recentEvents.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'bars-empty';
      empty.textContent = 'まだ応援データがありません';
      recentBars.appendChild(empty);
      return;
    }

    const maxVal = Math.max.apply(null, recentEvents.map((e) => e.intensity_total || 0).concat([1]));
    const ordered = recentEvents.slice().reverse(); // 古い→新しい

    ordered.forEach((ev) => {
      const item = document.createElement('div');
      item.className = 'bar-item';

      const track = document.createElement('div');
      track.className = 'bar-track';

      const stick = document.createElement('div');
      stick.className = 'bar-stick';
      const pct = Math.max(6, Math.round((ev.intensity_total / maxVal) * 100));
      stick.style.height = pct + '%';
      track.appendChild(stick);

      const value = document.createElement('div');
      value.className = 'bar-value';
      value.textContent = formatNumber(ev.intensity_total);

      const title = document.createElement('div');
      title.className = 'bar-title';
      title.textContent = ev.title || '試合';

      const date = document.createElement('div');
      date.className = 'bar-date';
      date.textContent = formatDate(ev.date);

      item.appendChild(track);
      item.appendChild(value);
      item.appendChild(title);
      item.appendChild(date);
      recentBars.appendChild(item);
    });
  }

  function loadCheerStats(referenceUrl) {
    const query = extractReferenceQuery(referenceUrl);
    if (!query) return;

    cheerStatsSection.classList.remove('hidden');

    fetch(API_BASE + '/api/v1/webview/reference?' + query)
      .then((res) => {
        if (!res.ok) throw new Error('HTTP_' + res.status);
        return res.json();
      })
      .then((data) => {
        renderRecentBars(data.recent_events);
        allTimeNumber.textContent = formatNumber(data.all_time_intensity_total);
      })
      .catch(() => {
        // 応援データの取得に失敗しても、完了画面自体は表示済みのため
        // このセクションだけ静かに非表示に戻す（画面全体を壊さない）
        cheerStatsSection.classList.add('hidden');
      });
  }

  function renderConnect(msg) {
    if (cheerEnded) return; // 終了画面を維持（再接続後のconnect応答で画面が戻らないように）
    const { status, user, team, member, teams, targets, message } = msg;

    // category_id未設定デバイス等、そもそもカードを出せないケース。
    // 以前は分岐が無く画面が真っ黒になっていたため、ここで明示的にハンドリングする。
    if (status === 'error') {
      hideAllCards();
      showSplashError(
        'ご利用いただけません',
        message || 'サポートまでお問い合わせください。'
      );
      return;
    }

    if (!hasShownContent) {
      hasShownContent = true;
      hideSplash();
    }

    // connect応答にreference_urlが含まれる場合のみ、アプリへ転送する
    if (msg.reference_url) {
      window.CheerStickBridge && window.CheerStickBridge.sendData &&
        window.CheerStickBridge.sendData({ stat: 'connect', url: msg.reference_url });
    }

    if (team) {
      if (team.logo_url) {
        teamLogo.src = team.logo_url;
        teamLogo.classList.remove('hidden');
        teamLogoAvatar.classList.add('hidden');
      } else {
        teamLogoAvatar.textContent = (team.name || '?').charAt(0);
        teamLogoAvatar.style.background = colorFor(team.id);
        teamLogoAvatar.classList.remove('hidden');
        teamLogo.classList.add('hidden');
      }
      teamNameEl.textContent = team.name;
      teamNameEl.classList.remove('hidden');

      currentTeamColor = team.color || DEFAULT_TEAM_COLOR;
      document.documentElement.style.setProperty('--team-color', currentTeamColor);
    } else {
      teamLogo.classList.add('hidden');
      teamLogoAvatar.classList.add('hidden');
      teamNameEl.classList.add('hidden');
    }

    hideAllCards();

    if (status === 'unregistered') {
      nameFormCard.classList.remove('hidden');
      registerBtn.disabled = false;
    } else if (status === 'team_selection') {
      teamSelectCard.classList.remove('hidden');
      renderTeamList(teams || []);
    } else if (status === 'player_selection') {
      playerSelectCard.classList.remove('hidden');
      renderPlayerList(targets || []);
    } else if (status === 'complete') {
      welcomeCard.classList.remove('hidden');
      welcomeName.textContent = user.name;

      cheerStatsSection.classList.add('hidden');
      if (msg.reference_url) {
        loadCheerStats(msg.reference_url);
      }

      if (member) {
        if (member.image_url) {
          oshiPhoto.src = member.image_url;
          oshiPhoto.classList.remove('hidden');
          oshiAvatar.classList.add('hidden');
        } else {
          oshiAvatar.textContent = (member.name || '?').charAt(0);
          oshiAvatar.style.background = colorFor(member.id);
          oshiAvatar.classList.remove('hidden');
          oshiPhoto.classList.add('hidden');
        }
        oshiName.textContent = member.name;
        oshiPosition.textContent =
          member.type === 'mascot' ? 'マスコット' : (member.number ? `背番号 ${member.number}` : (member.type || ''));
        oshiData.textContent = (member.metadata && member.metadata.description) || '';

        if (member.profile_text) {
          oshiProfileText.textContent = member.profile_text;
          oshiProfileText.classList.remove('hidden');
        } else {
          oshiProfileText.classList.add('hidden');
        }
      }
    }
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  registerBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    formError.classList.add('hidden');

    if (!name) {
      formError.textContent = 'ニックネームを入力してください';
      formError.classList.remove('hidden');
      return;
    }
    if (!isValidEmail(email)) {
      formError.textContent = 'メールアドレスの形式が正しくありません';
      formError.classList.remove('hidden');
      return;
    }

    registerBtn.disabled = true;
    send({ type: 'register', id: deviceId, name, email });
  });

  splashRetryBtn.addEventListener('click', () => {
    connect();
  });

  function enterCheeringScreen() {
    hideAllCards();
    cheeringCard.classList.remove('hidden');
    matchCheerCount = 0;
    cheerCountDisplay.textContent = '0';
    // 前回セッションからの電池残量警告の継続時間・表示状態を持ち越さない
    batteryLowSince = null;
    batteryDisplay.classList.add('hidden');
    // 5回バッチの途中経過を持ち越さない（終了→再開で端数が混ざらないように）
    cheerBatchCount = 0;
    cheerBatchSum = 0;
    cheerBatchStartedAt = null;
    bleDisconnectNotified = false;
    bleAlertDisplay.classList.add('hidden');
  }

  startCheeringBtn.addEventListener('click', enterCheeringScreen);

  // 終了画面からの再開。WebSocketは終了後も維持されているため再接続・再登録は不要。
  // 累積カウントは0から再スタート（保持は対象外）。
  resumeCheeringBtn.addEventListener('click', () => {
    cheerEnded = false;
    enterCheeringScreen();
  });

  // ---------- ネイティブアプリ向けブリッジ（送信側） ----------
  window.CheerStickBridge = {
    _post: function (obj) {
      const s = JSON.stringify(obj);
      // 注意: Androidのブリッジは非同期注入のため、
      //       起動時に判定を固定せず、送信のたびに判定すること
      if (window.webkit && window.webkit.messageHandlers
          && window.webkit.messageHandlers.myBridge) {
        window.webkit.messageHandlers.myBridge.postMessage(s);
      } else if (window.androidBridge) {
        window.androidBridge.postMessage(s);
      } else {
        console.warn('[bridge] native bridge not found:', s);
      }
    },
    sendLED:  function (o) { this._post(o); },
    sendEnd:  function (o) { this._post(o); },
    sendData: function (o) { this._post(o); }
  };

  endCheeringBtn.addEventListener('click', () => {
    window.CheerStickBridge && window.CheerStickBridge.sendEnd &&
      window.CheerStickBridge.sendEnd({ stat: 'end' });

    cheerEnded = true;
    hideAllCards();
    endedCard.classList.remove('hidden');
  });

  [nameInput, emailInput].forEach((el) => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') registerBtn.click();
    });
  });

  // ---------- 応援中画面：LED制御ロジック ----------
  const VIBRATION_THRESHOLD = 25;
  const MAX_INTENSITY = 21;
  // 強度0のときも完全消灯にはせず、各成分をこの値まで下限とする
  // （旧仕様の「10 + count*20」で消灯に見えすぎないようにしていた考え方を踏襲）
  const LED_MIN_COMPONENT = 10;

  // HEX文字列（#RRGGBB）をr/g/bに分解する
  function hexToRgb(hex) {
    const normalized = (hex || '').replace('#', '');
    return {
      r: parseInt(normalized.substring(0, 2), 16),
      g: parseInt(normalized.substring(2, 4), 16),
      b: parseInt(normalized.substring(4, 6), 16),
    };
  }

  // 軸1本（加速度の配列）のうち、絶対値がVIBRATION_THRESHOLDを超える要素数を数える
  function countOverThreshold(axisArray) {
    return (axisArray || []).filter((v) => Math.abs(v) > VIBRATION_THRESHOLD).length;
  }

  // 旧仕様準拠：x/y/z各軸で閾値超過した要素数を合算し、MAX_INTENSITYに丸めたものを
  // 「応援強度」とする。
  function analyzeVibrationData(accel) {
    if (!accel) return 0;
    const total =
      countOverThreshold(accel.x) + countOverThreshold(accel.y) + countOverThreshold(accel.z);
    return Math.min(total, MAX_INTENSITY);
  }

  // 応援強度（0〜21）を「明るさ」として、currentTeamColor（HEX）をその強さで
  // スケーリングしたr/g/bを返す。強度0でも完全消灯にはせず、各成分に
  // LED_MIN_COMPONENTの下限を設ける。
  function computeLedColor(accel) {
    const intensity = analyzeVibrationData(accel);
    const brightness = intensity / MAX_INTENSITY;
    const { r, g, b } = hexToRgb(currentTeamColor);
    const scale = (component) => Math.max(LED_MIN_COMPONENT, Math.round(component * brightness));
    return { r: scale(r), g: scale(g), b: scale(b) };
  }

  // BLE切断検知：accelが全軸ゼロ、かつvolt/rssiもゼロというパターン
  function isBleDisconnectPayload(payload) {
    const allZero = (arr) => Array.isArray(arr) && arr.length > 0 && arr.every((v) => v === 0);
    const accel = payload.accel || {};
    return (
      allZero(accel.x) && allZero(accel.y) && allZero(accel.z) &&
      payload.volt === 0 && payload.rssi === 0
    );
  }

  const BATCH_SIZE = 5;
  // 電池残量警告の閾値(V)。この電圧以下の状態が下記継続時間以上続いた場合のみ警告表示する
  // （2026-09-06、Vanstone様指摘によりLED点灯時の瞬間的な電圧降下での誤発報を解消するため、
  //   単発の瞬時値判定から継続時間判定へ変更。将来調整の可能性があるため定数化している）
  const BATTERY_LOW_THRESHOLD = 3.0;
  const BATTERY_LOW_DURATION_MS = 60 * 1000;

  let cheerBatchCount = 0;
  let cheerBatchSum = 0;
  let cheerBatchStartedAt = null;
  // volt <= BATTERY_LOW_THRESHOLD を連続して観測している間の開始時刻。
  // 一度でも閾値を上回ったらnullにリセットする（タイムスタンプベース。
  // window.onCheerStickDataの呼び出し間隔は1秒間隔を想定しているが（docs/spec.md 5.1）、
  // 実機の呼び出し間隔がその通りとは限らないため、呼び出し回数ではなく経過時間で判定する）
  let batteryLowSince = null;
  // BLE切断の通知（type: "ble_disconnect"）を、直近で送信済みかどうか（2026-09-29追加）。
  // 異常データを連続して受信し続けている間（BLEが切断されたまま）は、送信を最初の1回のみに
  // 絞る（＝立ち上がりエッジでのみ通知する）。isBleDisconnectPayload()は
  // window.onCheerStickDataが呼ばれるたびに毎回判定されるため、そのまま送信すると、
  // 1回の物理的な切断につき何十件もの通知が送られてしまい、Vanstone様が求める
  // 「頻度」の集計が意味を持たなくなるため。
  let bleDisconnectNotified = false;

  // Vanstoneへ提示する仮称: window.onCheerStickData
  // ネイティブアプリ側から加速度センサー等の生データを受け取るエントリポイント。
  // payload: { num, accel: { x:[...], y:[...], z:[...] }, volt, rssi }
  window.onCheerStickData = function (payload) {
    if (!payload) return;

    // a. 応援中画面が表示されていない間は何もしない
    if (cheeringCard.classList.contains('hidden')) return;

    // b. BLE切断検知。サーバーへ通知する（type: "ble_disconnect"、2026-09-29追加）。
    //    send()はWebSocketが接続中（OPEN）でなければ何もしない設計のため、接続が
    //    切れている間はここで無理に再接続等は行わず、そのまま送信をスキップする。
    if (isBleDisconnectPayload(payload)) {
      bleAlertDisplay.classList.remove('hidden');
      window.CheerStickBridge && window.CheerStickBridge.sendLED &&
        window.CheerStickBridge.sendLED({ LED: { r: 0, g: 0, b: 0 }, stat: 'BleRetry' });
      if (!bleDisconnectNotified) {
        bleDisconnectNotified = true;
        send({ type: 'ble_disconnect', id: deviceId });
      }
      return;
    }

    // c. 切断でなければアラート表示を戻す（次にまた切断したら、再度通知できるようにする）
    bleDisconnectNotified = false;
    bleAlertDisplay.classList.add('hidden');

    // d. 応援強度を算出
    const intensity = analyzeVibrationData(payload.accel);

    // e. 受信5回ごとにまとめてカウント表示更新・サーバー送信
    if (cheerBatchCount === 0) {
      cheerBatchStartedAt = Date.now();
    }
    cheerBatchCount += 1;
    cheerBatchSum += intensity;

    if (cheerBatchCount >= BATCH_SIZE) {
      matchCheerCount += cheerBatchSum;
      cheerCountDisplay.textContent = formatNumber(matchCheerCount);

      send({
        type: 'count',
        id: deviceId,
        value: cheerBatchSum,
        duration_ms: Date.now() - cheerBatchStartedAt,
      });

      cheerBatchCount = 0;
      cheerBatchSum = 0;
      cheerBatchStartedAt = null;
    }

    // f. LED値を計算して送信
    const led = computeLedColor(payload.accel);
    window.CheerStickBridge && window.CheerStickBridge.sendLED &&
      window.CheerStickBridge.sendLED({ LED: led, stat: 'OK' });

    // g. 電池残量チェック（60秒間連続して閾値以下の場合のみ警告表示。途中で1回でも
    //    閾値を超えたらカウントをリセットする＝瞬間的な電圧降下による誤発報を防ぐ）
    if (typeof payload.volt === 'number' && payload.volt <= BATTERY_LOW_THRESHOLD) {
      if (batteryLowSince === null) batteryLowSince = Date.now();
      if (Date.now() - batteryLowSince >= BATTERY_LOW_DURATION_MS) {
        batteryDisplay.classList.remove('hidden');
      } else {
        batteryDisplay.classList.add('hidden');
      }
    } else {
      batteryLowSince = null;
      batteryDisplay.classList.add('hidden');
    }
  };

  // ---------- ネイティブアプリ向けブリッジ（受信側） ----------
  // アプリ側は receiveFromApp(jsonString) を呼び出す（Vanstone確認済み）。
  // window.onCheerStickData の入口として、JSON文字列のパースのみ担う。
  window.receiveFromApp = function (jsonString) {
    try {
      const payload = (typeof jsonString === 'string')
        ? JSON.parse(jsonString) : jsonString;
      window.onCheerStickData(payload);
    } catch (e) {
      console.error('[bridge] parse error:', e, jsonString);
    }
  };

  connect();
})();
</script>
</body>
</html>
