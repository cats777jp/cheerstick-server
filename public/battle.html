<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>対抗戦 | 推しフル</title>
<style>
  :root {
    --bg: #0b0f14;
    --text: #f4f6f8;
    --text-muted: #9aa4af;
    --team-a-color: #e63946;
    --team-b-color: #3a86ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 16px;
  }
  #label {
    text-align: center;
    font-size: clamp(16px, 2.5vw, 28px);
    color: var(--text-muted);
    margin-bottom: 12px;
    min-height: 1.4em;
  }
  #connErrorBanner {
    display: none;
    text-align: center;
    background: #b3261e;
    color: #fff;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  #connErrorBanner.visible { display: block; }

  #battleGrid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    align-items: stretch;
    min-height: 0;
  }
  .team-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    padding: 10px 12px;
    min-width: 0;
  }
  #panelA { background: linear-gradient(160deg, color-mix(in srgb, var(--team-a-color) 28%, #0b0f14), #0b0f14); }
  #panelB { background: linear-gradient(200deg, color-mix(in srgb, var(--team-b-color) 28%, #0b0f14), #0b0f14); }

  .team-logo {
    width: clamp(56px, 11vw, 128px);
    height: clamp(56px, 11vw, 128px);
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 8px;
    background: #1f2733;
  }
  .team-logo-fallback {
    width: clamp(56px, 11vw, 128px);
    height: clamp(56px, 11vw, 128px);
    border-radius: 50%;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: clamp(24px, 4vw, 48px);
    color: #fff;
  }
  .team-name {
    font-size: clamp(16px, 2.6vw, 28px);
    font-weight: bold;
    text-align: center;
    margin-bottom: 2px;
    word-break: break-word;
  }
  .team-event-title {
    font-size: clamp(11px, 1.4vw, 14px);
    color: var(--text-muted);
    margin-bottom: 8px;
    text-align: center;
  }
  .team-score {
    font-size: clamp(40px, 9vw, 96px);
    font-weight: bold;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .team-score-unit {
    font-size: clamp(12px, 1.6vw, 16px);
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  /* 綱引き式ゲージ（対抗戦テーマ画像・綱引きゲージ機能、2026-09-25変更）：
     従来はチームごとに独立した2本のバーだったが、1本の連結バーへ変更。
     境界線の位置は自チーム比率（JS側で計算）に応じてtug-fill-aの幅が動く。
     2026-09-26、レイアウト調整（画像の次・カウンターの前に移動、太さ・全幅化、
     配色を中間色化）：配色はカウンター背景と同じcolor-mix()方式で75%ミックスとし、
     organizations.colorによる動的配色にもそのまま追従する（KMT様確認・承認済み）。
     同日追加要望により height を40px→56pxへさらに拡大。 */
  #tugGauge {
    width: 100%;
    height: 56px;
    margin: 0 0 20px;
    display: flex;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    overflow: hidden;
  }
  #tugFillA {
    height: 100%;
    background: color-mix(in srgb, var(--team-a-color) 75%, #0b0f14);
    width: 50%;
    transition: width 0.6s ease;
  }
  #tugFillB {
    height: 100%;
    background: color-mix(in srgb, var(--team-b-color) 75%, #0b0f14);
    width: 50%;
    transition: width 0.6s ease;
  }

  /* 火花演出（&gauge=recent&fx=spark、2026-10-01追加）。fx=spark指定時のみJSがクラスを付与／
     要素を生成する。未指定時は#tugGaugeShake・#tugGaugeWrapが素通りの箱として存在するだけで、
     見た目は変わらない。
     揺れ（.gauge-shake）は、JSがwidthを毎フレーム更新しているゲージ本体（#tugFillA/B）ではなく、
     その外側のラッパー（#tugGaugeShake）にのみ適用する（transformとの競合回避）。 */
  #tugGaugeWrap { position: relative; }
  #tugGaugeShake { transform-origin: 50% 50%; }
  #tugGaugeShake.gauge-shake { animation: barShake .35s ease-in-out infinite; }

  /* gauge=recent全般（fx=sparkの有無によらず）：ゲージの縦幅を2倍（56px→112px）にし、
     火花レイヤーの高さも連動させる。増えた高さは、flex:1の#battleGrid（数値エリア）が
     自動的に吸収して縮む。パラメータ無しの画面は、このクラスが付かないため変わらない
     （2026-10-01追加）。 */
  #tugGaugeWrap.gauge-tall #tugGauge { height: 112px; }
  #tugGaugeWrap.gauge-tall #sparkLayer { height: 112px; }

  /* ゲージが2倍になった分、画面の高さが低い場合に数値エリアが窮屈になるため、gauge=recentのときだけ
     pt表示のフォントを画面の高さ（vh）にも比例させて縮める。1280x900以上では従来のclamp上限
     （96px）のままで変わらない。 */
  html.gauge-recent-mode .team-score { font-size: clamp(32px, min(9vw, 11vh), 96px); }
  html.gauge-recent-mode .team-score-unit { margin-bottom: 0; }

  /* バー色（グラデーション）：外側が濃く、拮抗点側が薄い。gauge=recent全般に適用
     （当初はfx=sparkのみ。2026-10-01、gauge=recent全般へ昇格）。 */
  #tugGauge.gauge-recent #tugFillA { background: linear-gradient(90deg, #7A0F12 0%, #DC2626 42%, #FFC9A6 100%); }
  #tugGauge.gauge-recent #tugFillB { background: linear-gradient(90deg, #D8E8FF 0%, #2563EB 58%, #0A1F52 100%); }

  /* 火花・光のレイヤー：ゲージ（高さ56px）と同じ高さ・幅の透明な重ね合わせ。 */
  #sparkLayer {
    position: absolute; left: 0; right: 0; top: 0; height: 56px; /* gauge-tall時は112px（上記） */
    pointer-events: none; display: none; z-index: 5;
  }
  #sparkLayer.on { display: block; }
  .spark-field { position: absolute; top: 50%; width: 0; height: 0; }
  .gauge-hot-glow {
    position: absolute; top: 50%; width: 110px; height: 110px;
    margin-left: -55px; margin-top: -55px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,120,.65) 0%, rgba(255,120,40,.3) 40%, transparent 70%);
    animation: hotGlow .6s ease-in-out infinite;
    mix-blend-mode: screen; pointer-events: none;
  }
  .spark-dot {
    position: absolute; left: 0; top: 0; border-radius: 50%;
    animation-name: spark; animation-timing-function: cubic-bezier(.15,.7,.3,1);
    animation-iteration-count: infinite;
    mix-blend-mode: screen;
  }
  .spark-dot.hot   { background: radial-gradient(circle, #FFFBEA 0%, #FFE59A 45%, transparent 78%); }
  .spark-dot.warm  { background: radial-gradient(circle, #FFF6DA 0%, #FFB84D 50%, transparent 80%); }
  .spark-dot.ember { background: radial-gradient(circle, #FFD98C 0%, #FF7A28 55%, transparent 82%); }
  @keyframes spark {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: var(--end) scale(.05);     opacity: 0; }
  }
  @keyframes barShake {
    0%, 100% { transform: translateX(0)    scaleY(1);    }
    20%      { transform: translateX(-5px) scaleY(1.12); }
    45%      { transform: translateX(4px)  scaleY(.92);  }
    70%      { transform: translateX(-3px) scaleY(1.08); }
    90%      { transform: translateX(3px)  scaleY(.96);  }
  }
  @keyframes hotGlow {
    0%, 100% { opacity: .6; transform: scale(1);   }
    50%      { opacity: 1;  transform: scale(1.6); }
  }

  .theme-image {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 46vh;
    margin: 0 auto 14px;
    border-radius: 12px;
  }

  #vsDivider {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 3vw, 40px);
    font-weight: bold;
    color: var(--text-muted);
    padding: 0 8px;
  }

  #updatedAt {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 10px;
  }

  /* 更新停止の診断（gauge=recentのときだけ使用、2026-09-28追加）：最後の成功取得から
     STALE_INDICATOR_THRESHOLD_MS以上経つと表示する、控えめな表示。 */
  #staleIndicator {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ゲージ「直近の勢い」表示（&gauge=recent、2026-09-28追加）：既定（従来方式）では
     常にhiddenのまま。gauge=recent指定時のみJS側でhiddenを外し、テキストを設定する。 */
  #gaugeModeLabel {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin: -12px 0 8px;
  }

  #loadingState, #errorState {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text-muted);
    text-align: center;
    padding: 20px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="connErrorBanner"></div>

  <div id="loadingState">読み込み中...</div>

  <div id="errorState" hidden></div>

  <div id="battleContent" hidden style="display: contents;">
    <img id="themeImage" class="theme-image" alt="" hidden>
    <div id="label"></div>
    <div id="tugGaugeWrap">
      <div id="tugGaugeShake"><div id="tugGauge"><div id="tugFillA"></div><div id="tugFillB"></div></div></div>
      <div id="sparkLayer"></div>
    </div>
    <div id="gaugeModeLabel" hidden></div>
    <div id="battleGrid">
      <div id="panelA" class="team-panel">
        <div id="logoWrapA"></div>
        <div id="nameA" class="team-name"></div>
        <div id="eventTitleA" class="team-event-title"></div>
        <div id="scoreA" class="team-score">0</div>
        <div class="team-score-unit">pt</div>
      </div>
      <div id="vsDivider">VS</div>
      <div id="panelB" class="team-panel">
        <div id="logoWrapB"></div>
        <div id="nameB" class="team-name"></div>
        <div id="eventTitleB" class="team-event-title"></div>
        <div id="scoreB" class="team-score">0</div>
        <div class="team-score-unit">pt</div>
      </div>
    </div>
    <div id="updatedAt"></div>
    <div id="staleIndicator" hidden>接続確認中…</div>
  </div>
</div>

<script>
(function () {
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? '/api/v1'
    : 'https://api.cheerstick.com/api/v1';

  const DEFAULT_POLL_INTERVAL_MS = 3000;

  const urlParams = new URLSearchParams(location.search);
  const battleId = urlParams.get('battle_id');

  // URLパラメータ（ゲージ「直近の勢い」表示、2026-09-28追加）。
  // パラメータを付けない場合、gaugeMode='cumulative'・pollIntervalMs=3000となり、
  // 従来どおりの表示・挙動になる（1章「変更してはいけないこと」）。
  function clampNum(n, min, max) {
    return Math.min(Math.max(n, min), max);
  }
  // 数値でない場合は既定値に戻す。数値だが範囲外の場合は範囲内にclampする
  // （指示書2-2：「不正な値は既定値に戻す」＝非数値、「5〜120の範囲に収める」等＝範囲外の数値）。
  function parseParamNumber(name, defaultValue, min, max) {
    const raw = urlParams.get(name);
    if (raw === null) return defaultValue;
    const n = Number(raw);
    if (!Number.isFinite(n)) return defaultValue;
    return clampNum(n, min, max);
  }

  const gaugeMode = urlParams.get('gauge') === 'recent' ? 'recent' : 'cumulative';
  const gaugeWindowSec = parseParamNumber('window', 15, 5, 120);
  const gaugeAmp = parseParamNumber('amp', 3, 1, 10);
  const pollIntervalMs = parseParamNumber('poll', DEFAULT_POLL_INTERVAL_MS, 1000, 10000);
  // 押し込まれない範囲（&range、2026-09-28調整で追加）。gauge=recentのときだけ有効。
  // 単位は%（0〜45）。各チームは、ゲージの少なくともrange%を必ず確保する。
  const gaugeRangePercent = parseParamNumber('range', 20, 0, 45);
  const gaugeRangeFraction = gaugeRangePercent / 100;

  // 累計差が小さいときに、rangeを中央寄りに制限する（&narrowThresholdPct・&narrowRangePct、
  // 2026-09-29追加。gauge=recentのときだけ有効）。
  // narrowRangePctは「中央（50%）からの半width」として扱う（既定10 → 40%〜60%の意味）。
  // 指示書中の「range=20の代わりに実質range=10相当にする」という記述は、既存のrange
  // パラメータ（負けている側の下限=range%という定義）とは軸が異なる別表現であり、その
  // まま同じ意味でnarrowRangePct=10を当てはめると逆に範囲が広がってしまう（「中央寄りに
  // 制限する」という目的と矛盾する）ため、指示書の具体例（40%〜60%）の方を正として、
  // 半width方式で解釈した。この解釈はKMT様へ停止ポイントで報告し確認を得ること。
  const narrowThresholdPercent = parseParamNumber('narrowThresholdPct', 3, 0, 100);
  const narrowRangePercent = parseParamNumber('narrowRangePct', 10, 0, 50);

  // 累計の差（|a-b|/(a+b)）に応じた、実際に使うrange（%）を求める。
  // 差がnarrowThresholdPercent以上なら、通常どおりgaugeRangePercentをそのまま使う。
  // 差0%〜narrowThresholdPercent%の間は、(50-narrowRangePercent)からgaugeRangePercentへ
  // 線形に補間する（差0%のとき最も狭い40%〜60%相当、差narrowThresholdPercent%のとき
  // 既定rangeに達する）。
  function computeEffectiveRangePercent(totalA, totalB) {
    if (narrowThresholdPercent <= 0) return gaugeRangePercent;
    const sum = totalA + totalB;
    const diffPercent = sum > 0 ? (Math.abs(totalA - totalB) / sum) * 100 : 0;
    if (diffPercent >= narrowThresholdPercent) return gaugeRangePercent;
    const narrowFloorPercent = 50 - narrowRangePercent;
    const t = diffPercent / narrowThresholdPercent;
    return narrowFloorPercent + (gaugeRangePercent - narrowFloorPercent) * t;
  }

  // --- 「常に動く仕組み」の定数（gauge=recentのときだけ使用、2026-09-28調整で追加） ---------
  // 2-(a) カウンターの連続表示：直近何ミリ秒の差分から増加速度を求めるか（指示書は固定15秒。
  // gauge=recentのwindowパラメータ（可変・既定15秒）とは独立させている）。
  const COUNTER_RATE_WINDOW_MS = 15000;
  // 2-(a) 推定の上限：最後の実測からこのミリ秒を超えて増やし続けない。
  const COUNTER_ESTIMATE_MAX_MS = 4000;
  // 2-(b) ゲージのなめらかな追従の時定数（秒）。小さいほど素早く目標に追従する。
  const GAUGE_SMOOTHING_TAU_SEC = 0.5;
  // 2-(c) 呼吸の揺れ：振幅（ポイント、±）と周期（秒）。
  const GAUGE_BREATH_AMPLITUDE_POINTS = 1.5;
  const GAUGE_BREATH_PERIOD_SEC = 3;
  // 3-(a) スコアAPI fetchのタイムアウト（ミリ秒）。
  const FETCH_TIMEOUT_MS = 8000;
  // 3-(b) 最後の成功取得からこのミリ秒以上経ったら「接続確認中」を表示する。
  const STALE_INDICATOR_THRESHOLD_MS = 4000;
  // 3-(c) 表示値が変わらない区間を検知する間隔・しきい値（診断用、window.__battleDebug）。
  const UNCHANGED_CHECK_INTERVAL_MS = 500;
  const UNCHANGED_SPAN_THRESHOLD_MS = 3000;

  // カウンター（表示中の推定pt合計）の短期停滞検知（2026-09-29追加）。
  // 「揺れ・位置の保持（holding）」判定を、直近window秒の応援量差分だけでなく、
  // この短期判定にもそろえる（gaugeAnimState周辺のコメント参照）。
  // 直近COUNTER_STALL_WINDOW_MS間の増分がCOUNTER_STALL_EPSILON_POINTS未満なら
  // 「増えていない」とみなす。既存の応援中の動き（毎秒十分な増分がある）には
  // 影響しない程度に小さく、かつ応援停止をおおむね1秒程度で検知できる値とした。
  const COUNTER_STALL_WINDOW_MS = 500;
  const COUNTER_STALL_EPSILON_POINTS = 1;

  // 火花演出（&fx=spark、2026-10-01追加）の発火しきい値。「勢い」＝なめらかに追従済みの
  // リーダー側への押し込み幅gaugeAnimState.smoothedMagnitude（0〜0.5-range、ゲージ位置の
  // 50%からのずれ）。これがこの値以上、かつ揺れ停止中（holding）でないときだけ発火する。
  // 0.20＝リーダー側が70%以上（既定range=20のとき最大は0.30＝80%）。
  const SPARK_INTENSITY_THRESHOLD = 0.20;

  const loadingState = document.getElementById('loadingState');
  const errorState = document.getElementById('errorState');
  const battleContent = document.getElementById('battleContent');
  const connErrorBanner = document.getElementById('connErrorBanner');
  const gaugeModeLabel = document.getElementById('gaugeModeLabel');
  const staleIndicatorEl = document.getElementById('staleIndicator');
  const tugFillAEl = document.getElementById('tugFillA');
  const tugFillBEl = document.getElementById('tugFillB');

  if (gaugeMode === 'recent') {
    gaugeModeLabel.textContent = `勢い（直近${gaugeWindowSec}秒）`;
    gaugeModeLabel.hidden = false;
    // 2-(b) ゲージのなめらかな追従はJS（requestAnimationFrame）が毎フレーム行うため、
    // 既存のCSS transitionと二重に効いて遅延が積み重なるのを避けるため無効化する。
    tugFillAEl.style.transition = 'none';
    tugFillBEl.style.transition = 'none';
    // 縦幅2倍・グラデーション（2026-10-01、gauge=recent全般に適用。fx=sparkとは独立）。
    document.documentElement.classList.add('gauge-recent-mode');
    document.getElementById('tugGaugeWrap').classList.add('gauge-tall');
    document.getElementById('tugGauge').classList.add('gauge-recent');
  }

  // 火花演出（2026-10-01追加）：gauge=recentのときに有効。「勢い」の値がgauge=recentの
  // 計算結果（smoothedMagnitude）に依存するため。2026-10-06、既定ONへ変更：&fx=noneのときだけ
  // 無効化する除外方式（旧&fx=sparkも引き続き有効）。
  const sparkFxActive = urlParams.get('fx') !== 'none' && gaugeMode === 'recent';
  const sparkLayerEl = document.getElementById('sparkLayer');
  const tugGaugeShakeEl = document.getElementById('tugGaugeShake');
  let sparkFieldEl = null;
  let sparkGlowEl = null;
  let sparkOn = false;

  if (sparkFxActive) {
    // [色, 直径px, 終点x, 終点y, 継続秒, 遅延秒]（28個）
    const SPARKS = [
      ['hot',15,-120,-150,.5,0],['warm',11,100,-170,.58,.04],['ember',17,-60,-190,.46,.08],
      ['hot',9,150,-110,.52,.12],['warm',13,-160,-80,.6,.16],['ember',11,40,-210,.44,.2],
      ['hot',15,-90,-175,.56,.24],['warm',11,130,-150,.5,.28],['ember',13,-20,-140,.48,.32],
      ['hot',9,70,-90,.54,.36],['warm',15,-140,-130,.58,.4],['ember',11,180,-60,.5,.44],
      ['hot',13,10,-230,.46,.02],['warm',9,-180,-40,.62,.06],['ember',17,110,-200,.5,.1],
      ['hot',11,-50,-100,.4,.14],['warm',13,200,-130,.54,.18],['ember',9,-110,-210,.48,.22],
      ['hot',15,30,-160,.56,.26],['warm',11,-200,-100,.5,.3],['ember',13,160,-40,.6,.34],
      ['hot',9,-30,-220,.44,.38],['warm',17,80,-180,.58,.42],['ember',11,-140,-170,.46,.46],
      ['hot',13,190,-90,.52,0],['warm',9,-70,-60,.4,.24],['ember',15,20,-100,.5,.48],
      ['hot',11,-180,-150,.54,.36],
    ];
    sparkFieldEl = document.createElement('div');
    sparkFieldEl.className = 'spark-field';
    // 上下両方向に飛び散らせる（2026-10-01）：上記の座標（元はすべて上方向＝yが負）のうち、
    // 奇数番目（0始まり）のyの符号を反転して下方向にする（14個ずつ。x・個数・色・速さは不変）。
    SPARKS.forEach(([cls, size, ex, eyUp, dur, delay], i) => {
      const ey = (i % 2 === 1) ? -eyUp : eyUp;
      const dot = document.createElement('div');
      dot.className = 'spark-dot ' + cls;
      dot.style.width = dot.style.height = size + 'px';
      dot.style.setProperty('--end', `translate(${ex}px,${ey}px)`);
      dot.style.animationDuration = dur + 's';
      dot.style.animationDelay = delay + 's';
      sparkFieldEl.appendChild(dot);
    });
    sparkGlowEl = document.createElement('div');
    sparkGlowEl.className = 'gauge-hot-glow';
    sparkLayerEl.appendChild(sparkGlowEl);
    sparkLayerEl.appendChild(sparkFieldEl);
  }

  // 毎フレーム（tickRecent）から呼ぶ。位置（拮抗点＝ゲージ境界のA側幅%）は毎フレーム追従し、
  // 発火のON/OFFはクラスの付け外しだけで行う。
  function updateSparkFx(gaugeAFraction, isHolding, magnitude) {
    const leftPct = `${(gaugeAFraction * 100).toFixed(2)}%`;
    sparkFieldEl.style.left = leftPct;
    sparkGlowEl.style.left = leftPct;
    tugGaugeShakeEl.style.transformOrigin = `${leftPct} 50%`;
    const shouldBeOn = !isHolding && magnitude >= SPARK_INTENSITY_THRESHOLD;
    if (shouldBeOn !== sparkOn) {
      sparkOn = shouldBeOn;
      sparkLayerEl.classList.toggle('on', sparkOn);
      tugGaugeShakeEl.classList.toggle('gauge-shake', sparkOn);
      battleDebug.sparkOn = sparkOn;
    }
  }

  // 診断用（3-(c)、2026-09-28調整で追加）：画面には出さない。テスト後にブラウザの
  // コンソールで window.__battleDebug を確認する。gauge=recentに限らず常に収集する。
  const battleDebug = {
    lastOkAt: null,
    maxGapMs: 0,
    gapsOver3s: [],
    requestCount: 0,
    failureCount: 0,
    timeoutCount: 0,
    renderErrorCount: 0,
    lastRenderError: null,
    lastChangedAt: null,
    unchangedSpans: [],
  };
  window.__battleDebug = battleDebug;

  function recordPollSuccess(now) {
    if (battleDebug.lastOkAt !== null) {
      const gap = now - battleDebug.lastOkAt;
      if (gap > battleDebug.maxGapMs) battleDebug.maxGapMs = gap;
      if (gap > 3000) battleDebug.gapsOver3s.push({ startedAt: battleDebug.lastOkAt, gapMs: gap });
    }
    battleDebug.lastOkAt = now;
  }

  // 表示値が3秒以上変わらない区間を検知する（診断用、モードによらず常時動かす）。
  const unchangedCheckState = { lastText: null, unchangedStartedAt: Date.now(), flaggedIndex: -1 };
  function checkUnchangedSpan() {
    const now = Date.now();
    const scoreAEl = document.getElementById('scoreA');
    const scoreBEl = document.getElementById('scoreB');
    if (!scoreAEl || !scoreBEl) return;
    const text = scoreAEl.textContent + '|' + scoreBEl.textContent;
    if (text !== unchangedCheckState.lastText) {
      unchangedCheckState.lastText = text;
      unchangedCheckState.unchangedStartedAt = now;
      unchangedCheckState.flaggedIndex = -1;
      battleDebug.lastChangedAt = now;
      return;
    }
    const duration = now - unchangedCheckState.unchangedStartedAt;
    if (duration >= UNCHANGED_SPAN_THRESHOLD_MS) {
      if (unchangedCheckState.flaggedIndex === -1) {
        battleDebug.unchangedSpans.push({ startedAt: unchangedCheckState.unchangedStartedAt, durationMs: duration });
        unchangedCheckState.flaggedIndex = battleDebug.unchangedSpans.length - 1;
      } else {
        battleDebug.unchangedSpans[unchangedCheckState.flaggedIndex].durationMs = duration;
      }
    }
  }
  setInterval(checkUnchangedSpan, UNCHANGED_CHECK_INTERVAL_MS);

  function showFatalError(message) {
    loadingState.hidden = true;
    battleContent.hidden = true;
    errorState.hidden = false;
    errorState.textContent = message;
  }

  function showConnError(message) {
    connErrorBanner.textContent = message;
    connErrorBanner.classList.add('visible');
  }

  function clearConnError() {
    connErrorBanner.classList.remove('visible');
  }

  if (!battleId) {
    showFatalError('URLに battle_id パラメータがありません。\n管理画面の「対抗戦ペア一覧」からURLをコピーしてください。');
    return;
  }

  function formatNumber(n) {
    return Number(n || 0).toLocaleString('ja-JP');
  }

  function colorFor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    const AVATAR_COLORS = ['#e63946', '#2a9d8f', '#e9c46a', '#8338ec', '#3a86ff', '#ff6b6b'];
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  function renderTeamPanel({ logoWrapEl, nameEl, eventTitleEl, team, fallbackColor, hideIdentity }) {
    const org = team.organization;
    const name = org ? org.name : (team.event_title || '(チーム未設定)');
    eventTitleEl.textContent = team.event_title || '';

    // テーマ画像表示時（対抗戦テーマ画像機能、2026-09-25追加）：画像内に既に
    // チーム名・ロゴが含まれているため、個別表示は非表示にする（後方互換：
    // テーマ画像未設定時はhideIdentity=falseで従来通り表示）。
    nameEl.hidden = hideIdentity;
    logoWrapEl.hidden = hideIdentity;
    if (hideIdentity) return;

    nameEl.textContent = name;
    logoWrapEl.innerHTML = '';
    if (org && org.logo_url) {
      const img = document.createElement('img');
      img.className = 'team-logo';
      img.src = org.logo_url;
      img.alt = name;
      img.onerror = () => {
        img.remove();
        logoWrapEl.appendChild(buildFallbackAvatar(name, fallbackColor));
      };
      logoWrapEl.appendChild(img);
    } else {
      logoWrapEl.appendChild(buildFallbackAvatar(name, fallbackColor));
    }
  }

  function buildFallbackAvatar(name, fallbackColor) {
    const div = document.createElement('div');
    div.className = 'team-logo-fallback';
    div.style.background = fallbackColor;
    div.textContent = (name || '?').trim().charAt(0).toUpperCase();
    return div;
  }

  function render(data) {
    // 3-(d)(e) 描画の停止対策：不正な値（NaN・欠落等）をDOMへ反映する前に検知し、
    // 例外として呼び出し元（poll()）へ通知する。DOM更新は開始していないため、
    // 表示は直前の値のまま保たれる。
    const totalA = data && data.team_a && data.team_a.total_intensity;
    const totalB = data && data.team_b && data.team_b.total_intensity;
    if (!Number.isFinite(totalA) || !Number.isFinite(totalB)) {
      throw new Error('invalid score data: total_intensity is not a finite number');
    }

    document.getElementById('label').textContent = data.label || '';

    const orgAColor = (data.team_a.organization && data.team_a.organization.color) || colorFor(data.team_a.event_id);
    const orgBColor = (data.team_b.organization && data.team_b.organization.color) || colorFor(data.team_b.event_id);
    document.documentElement.style.setProperty('--team-a-color', orgAColor);
    document.documentElement.style.setProperty('--team-b-color', orgBColor);

    // テーマ画像（対抗戦テーマ画像機能、2026-09-25追加）：設定時はヘッダーへ
    // 1枚画像をそのまま表示し、個別のチームロゴ・チーム名は非表示にする
    // （画像内に既に含まれているため）。未設定時は従来通り（後方互換）。
    const themeImageEl = document.getElementById('themeImage');
    const hasThemeImage = !!data.theme_image_url;
    if (hasThemeImage) {
      themeImageEl.src = data.theme_image_url;
      themeImageEl.hidden = false;
    } else {
      themeImageEl.hidden = true;
      themeImageEl.removeAttribute('src');
    }

    renderTeamPanel({
      logoWrapEl: document.getElementById('logoWrapA'),
      nameEl: document.getElementById('nameA'),
      eventTitleEl: document.getElementById('eventTitleA'),
      team: data.team_a,
      fallbackColor: orgAColor,
      hideIdentity: hasThemeImage,
    });
    renderTeamPanel({
      logoWrapEl: document.getElementById('logoWrapB'),
      nameEl: document.getElementById('nameB'),
      eventTitleEl: document.getElementById('eventTitleB'),
      team: data.team_b,
      fallbackColor: orgBColor,
      hideIdentity: hasThemeImage,
    });

    // gauge=recent指定時、カウンターの数字はrequestAnimationFrameの推定表示
    // （tickRecent()）が専有する。ここで実測値を直接書き込むと、推定表示が
    // 一瞬実測より低い値に巻き戻って見える可能性があるため、書き込まない
    // （「常に動く仕組み」2-(a)、2026-09-28調整で追加）。実測値自体は
    // poll()側でupdateCounterRate()へ渡され、推定の基準点として使われる。
    if (gaugeMode !== 'recent') {
      document.getElementById('scoreA').textContent = formatNumber(totalA);
      document.getElementById('scoreB').textContent = formatNumber(totalB);
    }

    // 綱引き式ゲージ（2026-09-25変更）：自チーム比率 = 自チーム応援量 / (両チーム応援量の合計)。
    // 両チームとも0の場合はゼロ除算を避けるため50:50固定とする。
    // gauge=recent指定時は、ここでは計算しない（poll()側でupdateGaugeRecent()の結果を
    // targetAPositionとして設定し、tickRecent()が毎フレーム滑らかに追従する。
    // 「直近の勢い」表示、2026-09-28追加・2026-09-28調整）。
    if (gaugeMode !== 'recent') {
      const sum = totalA + totalB;
      const ratioA = sum > 0 ? totalA / sum : 0.5;
      applyGaugeWidth(ratioA);
    }

    document.getElementById('updatedAt').textContent =
      '最終更新: ' + new Date(data.updated_at).toLocaleTimeString('ja-JP');

    loadingState.hidden = true;
    errorState.hidden = true;
    battleContent.hidden = false;
  }

  function applyGaugeWidth(ratioA) {
    document.getElementById('tugFillA').style.width = `${(ratioA * 100).toFixed(2)}%`;
    document.getElementById('tugFillB').style.width = `${((1 - ratioA) * 100).toFixed(2)}%`;
  }

  // ゲージ「直近の勢い」表示（gauge=recent、2026-09-28追加）。
  //
  // 設計上の判断：指示書2-3の手順どおりに実装すると、「dA+dBが小さすぎる場合は直前の
  // ゲージ位置をそのまま保持する」処理と「リーダーは累計の多い方」処理が同じタイミングで
  // まとめて更新される形になり、理論上（ごく僅かな差でdA+dBが1未満に収まる場面）保持中の
  // ゲージが示す側と、その瞬間の累計値（pt）の多い側が食い違いうる。指示書の不変条件
  // 「ゲージが優勢な側と、ptの多い側が食い違うことは無い」を厳密に満たすため、
  // 「保持」の対象を最終的なゲージ位置そのものではなく、リーダー側への押し込み幅
  // （0〜0.5、amp適用後）とし、**リーダー自体は毎回、生の累計値（a・b）から判定**する
  // （同点のときのみ直前のリーダーを保持。指示書どおり）設計に変更した。
  const gaugeRecentState = {
    history: [], // [{t, a, b}]（cheered_atではなくポーリング受信時刻を使う）
    leader: null, // 'A' | 'B' | null（同点継続中で未確定の場合）
    lastMagnitude: 0, // 直前の押し込み幅（0〜0.5）。dA+dBが小さすぎる場合に保持する
    // 直近の応援が実質0で、lastMagnitudeを保持（更新せず）している間はtrue
    // （2026-09-29追加。「揺れを止める」の判定に使う。tickRecent()参照）。
    holding: true,
    // 累計差に応じた、今この瞬間に使うrange（0〜0.5未満）。2026-09-29追加。
    effectiveRangeFraction: gaugeRangeFraction,
  };

  function updateGaugeRecent(totalA, totalB, now) {
    const state = gaugeRecentState;
    state.history.push({ t: now, a: totalA, b: totalB });

    // window秒より古い履歴を捨てる。ただし窓の開始時点をまたぐ直前の1件は
    // 補間のため残す（指示書2-3-1）。
    const cutoffMs = now - gaugeWindowSec * 1000;
    while (state.history.length > 2 && state.history[1].t <= cutoffMs) {
      state.history.shift();
    }

    // リーダーは常に生の累計値から判定する（同点の場合のみ直前のリーダーを保持）。
    if (totalA > totalB) state.leader = 'A';
    else if (totalB > totalA) state.leader = 'B';

    const oldest = state.history[0];
    const dA = totalA - oldest.a;
    const dB = totalB - oldest.b;
    const total = dA + dB;

    // 累計差に応じたrange（2026-09-29追加）。holding中かどうかによらず、常に
    // 現在の累計値から計算し直す（固定中の位置のclamp範囲にもそのまま使う）。
    state.effectiveRangeFraction = computeEffectiveRangePercent(totalA, totalB) / 100;

    // カウンター（表示中の推定pt合計）が直近で増えていない場合も、holdingとして扱う
    // （2026-09-29調整）。window秒の差分（total）だけで判定すると、応援停止直後も
    // window秒かけて履歴が抜けていく間、まだ「応援あり」と誤判定され続け、
    // その間ゲージが遅れて動いてしまう（実機確認で発覚。docs/worklog.md参照）。
    // counterStallState.stalledは、tickRecent()側でカウンターの表示値から
    // 毎フレーム（COUNTER_STALL_WINDOW_MSごと）判定しているため、window秒より
    // ずっと短い時間で反映される。
    if (state.history.length >= 2 && total >= 1 && !counterStallState.stalled) {
      const shareA = dA / total;
      const shareL = state.leader === 'A' ? shareA : state.leader === 'B' ? (1 - shareA) : 0.5;
      // 押し込まれない範囲（&range、2026-09-28調整で追加）：リーダー側の上限を
      // 1.0ではなく1-range%に抑えることで、負けている側にも最低range%を残す。
      const gaugeL = clampNum(0.5 + (shareL - 0.5) * gaugeAmp, 0.5, 1 - state.effectiveRangeFraction);
      state.lastMagnitude = gaugeL - 0.5;
      state.holding = false;
    } else {
      // total < 1、履歴1件のみ（初回）、またはカウンターが停滞中の場合は、
      // lastMagnitudeを更新せず保持する（＝「揺れを止める」対象、2026-09-28〜29追加）。
      state.holding = true;
    }

    if (state.leader === null) return 0.5; // 初回・同点継続中で未確定
    const gaugeL = 0.5 + state.lastMagnitude;
    return state.leader === 'A' ? gaugeL : (1 - gaugeL);
  }

  // --- 「常に動く仕組み」（gauge=recentのときだけ、2026-09-28調整で追加） -------------------
  //
  // カウンターの連続表示（2-(a)）：直近COUNTER_RATE_WINDOW_MS（固定15秒、gaugeWindowSecとは
  // 独立）の差分からpt/秒を求め、requestAnimationFrameで実測値の間を推定表示する。
  // 表示値はDBの値そのものではなく推定値であることに注意（実測が届くたびに基準点を更新する）。
  const counterState = {
    a: { history: [], base: 0, baseAt: 0, rate: 0, display: 0 },
    b: { history: [], base: 0, baseAt: 0, rate: 0, display: 0 },
  };

  // カウンターの短期停滞検知の状態（2026-09-29追加）。tickRecent()が毎フレーム、
  // COUNTER_STALL_WINDOW_MSごとに直近の増分を見て更新する。updateGaugeRecent()側は
  // これを読むだけ（このオブジェクト自体はtickRecent()側でのみ更新する）。
  const counterStallState = {
    referenceAt: null,
    referenceTotal: 0,
    stalled: false,
  };

  function updateCounterRate(totalA, totalB, now) {
    ['a', 'b'].forEach((key) => {
      const st = counterState[key];
      const total = key === 'a' ? totalA : totalB;
      st.history.push({ t: now, v: total });
      const cutoffMs = now - COUNTER_RATE_WINDOW_MS;
      while (st.history.length > 2 && st.history[1].t <= cutoffMs) st.history.shift();

      const oldest = st.history[0];
      const elapsedSec = (now - oldest.t) / 1000;
      st.rate = (st.history.length >= 2 && elapsedSec > 0) ? (total - oldest.v) / elapsedSec : 0;
      st.base = total;
      st.baseAt = now;
    });
  }

  // ゲージのなめらかな追従・呼吸の揺れ（2-(b)(c)）の状態。
  //
  // 設計上の判断（2026-09-28調整）：smoothedMagnitude（0〜0.5-range%、「リーダー側への
  // 押し込み幅」）は、updateGaugeRecent()がポーリングのたびに計算するgaugeRecentState.
  // lastMagnitudeへなめらかに追従させる。どちらのチームの側に表示するか（符号）は、
  // 毎フレーム、その時点で画面に表示している推定pt（counterState.*.display、2-(a)）を
  // 比較して決める。理由：カウンターの推定表示とゲージの計算は別々の推定（前者は
  // pt/秒の線形外挿、後者はポーリング時点のwindow秒間シェア）のため、ポーリングの間に
  // 表示中のpt（推定値）のリーダーが入れ替わる瞬間がありうる。符号をpoll時点のleaderに
  // 固定したままだと、その瞬間だけ「表示中のptで優勢な側とゲージの優勢側が食い違う」
  // （不変条件違反）が起こりうることをローカル確認（決定的シミュレーション）で検出したため、
  // 符号は常に「今まさに表示しているpt」に同期させる設計に変更した。
  // 押し込み幅（smoothedMagnitude）自体はポーリング時点の計算のままなめらかに追従するため、
  // 大きな押し込みの最中にリードが僅差で入れ替わった場合は、その瞬間にゲージの見た目が
  // 大きく切り替わる（跳ぶ）ことがある。これは「常に不変条件を満たすこと」を優先した結果で、
  // updateGaugeRecent()内の設計判断コメントと同じ考え方（正確性を優先）。
  const gaugeAnimState = {
    smoothedMagnitude: 0,
    displayLeader: null, // 'A' | 'B' | null。表示中の推定ptに基づく（同点時は直前を保持）
    lastFrameAt: null,
  };

  function tickRecent() {
    // requestAnimationFrameが渡す引数（performance.now()基準）は使わない。
    // counterState.baseAt・battleDebug.lastOkAtがDate.now()基準のため、
    // 時刻の基準がずれた状態で引き算すると経過時間が不正な値になる。
    const nowMs = Date.now();
    try {
      // 2-(a) カウンターの推定表示。最後の実測からCOUNTER_ESTIMATE_MAX_MSを超えて
      // 増やし続けない。新しい実測が来ても、数字は減らさない（保持）。
      ['a', 'b'].forEach((key) => {
        const st = counterState[key];
        const cappedElapsedSec = Math.min(nowMs - st.baseAt, COUNTER_ESTIMATE_MAX_MS) / 1000;
        const estimate = st.base + st.rate * cappedElapsedSec;
        st.display = Math.max(st.display, estimate);
      });
      document.getElementById('scoreA').textContent = formatNumber(Math.round(counterState.a.display));
      document.getElementById('scoreB').textContent = formatNumber(Math.round(counterState.b.display));

      // カウンターの短期停滞検知（2026-09-29追加）。直近COUNTER_STALL_WINDOW_MS間の
      // 表示合計の増分がCOUNTER_STALL_EPSILON_POINTS未満なら「増えていない」とみなす。
      // 揺れ・位置の保持（holding）を、この判定にもそろえる（下記の使用箇所参照）。
      const totalDisplay = counterState.a.display + counterState.b.display;
      if (counterStallState.referenceAt === null) {
        counterStallState.referenceAt = nowMs;
        counterStallState.referenceTotal = totalDisplay;
      } else if (nowMs - counterStallState.referenceAt >= COUNTER_STALL_WINDOW_MS) {
        counterStallState.stalled =
          (totalDisplay - counterStallState.referenceTotal) < COUNTER_STALL_EPSILON_POINTS;
        counterStallState.referenceAt = nowMs;
        counterStallState.referenceTotal = totalDisplay;
      }
      // else: 判定用の窓の途中なので、前回判定したstalledをそのまま使う。

      // 表示中の推定pt（上で更新したcounterState.*.display）を比較し、今まさに画面に
      // 出しているptのリーダーを毎フレーム決める（同点なら直前を保持）。ゲージの符号は
      // 常にこれに同期させる（このファイル冒頭のgaugeAnimStateのコメント参照）。
      if (counterState.a.display > counterState.b.display) gaugeAnimState.displayLeader = 'A';
      else if (counterState.b.display > counterState.a.display) gaugeAnimState.displayLeader = 'B';

      // 2-(b) 押し込み幅（リーダー側への、0〜0.5-range%）を、ポーリングのたびに
      // updateGaugeRecent()が計算するgaugeRecentState.lastMagnitudeへ時定数
      // GAUGE_SMOOTHING_TAU_SECでなめらかに追従させる（フレームレートに依存しない
      // 指数減衰方式）。
      if (gaugeAnimState.lastFrameAt !== null) {
        const dtSec = (nowMs - gaugeAnimState.lastFrameAt) / 1000;
        if (dtSec > 0) {
          const alpha = 1 - Math.exp(-dtSec / GAUGE_SMOOTHING_TAU_SEC);
          gaugeAnimState.smoothedMagnitude += (gaugeRecentState.lastMagnitude - gaugeAnimState.smoothedMagnitude) * alpha;
        }
      }
      gaugeAnimState.lastFrameAt = nowMs;

      // 2-(c) 呼吸の揺れ。加えた後、リーダー側が50%未満にならず、range%の範囲を
      // 超えないよう最後にclampする（表示中のptが同点継続中はrange%の範囲でclamp）。
      // ただし直近の応援が実質0で位置を保持中（holding）のときは、揺れを止めて
      // その位置に固定する（2026-09-28追加。「揺れを止める」対応）。
      // 2026-09-29調整：gaugeRecentState.holding（ポーリングのたびにのみ更新される）
      // だけでなく、counterStallState.stalled（毎フレーム更新される、カウンターの
      // 短期停滞検知）もORで加える。応援停止直後、次のポーリングが届くまでの間も
      // 揺れを即座に止めるため（実機確認で発覚した「停止直後、数秒間ゲージが片方へ
      // 振れてから中央へ戻る」現象への対応。docs/worklog.md参照）。
      const isHolding = gaugeRecentState.holding || counterStallState.stalled;
      const breathT = nowMs / 1000;
      const wobblePoints = isHolding
        ? 0
        : GAUGE_BREATH_AMPLITUDE_POINTS * Math.sin((2 * Math.PI * breathT) / GAUGE_BREATH_PERIOD_SEC);
      // clampに使うrangeは、累計差に応じてupdateGaugeRecent()が毎ポーリング更新する
      // 値を使う（固定range=gaugeRangeFractionではない。2026-09-29追加）。
      const effectiveRangeFraction = gaugeRecentState.effectiveRangeFraction;
      const leaderGaugeValue = 0.5 + gaugeAnimState.smoothedMagnitude + wobblePoints / 100;
      let finalA;
      if (gaugeAnimState.displayLeader === 'A') {
        finalA = clampNum(leaderGaugeValue, 0.5, 1 - effectiveRangeFraction);
      } else if (gaugeAnimState.displayLeader === 'B') {
        finalA = clampNum(1 - leaderGaugeValue, effectiveRangeFraction, 0.5);
      } else {
        finalA = clampNum(0.5 + wobblePoints / 100, effectiveRangeFraction, 1 - effectiveRangeFraction);
      }
      applyGaugeWidth(finalA);
      if (sparkFxActive) updateSparkFx(finalA, isHolding, gaugeAnimState.smoothedMagnitude);

      // 3-(b) 最後の成功取得からSTALE_INDICATOR_THRESHOLD_MS以上経ったら表示、回復したら消す。
      const staleMs = battleDebug.lastOkAt === null ? 0 : nowMs - battleDebug.lastOkAt;
      staleIndicatorEl.hidden = !(battleDebug.lastOkAt !== null && staleMs >= STALE_INDICATOR_THRESHOLD_MS);
    } catch (err) {
      // 3-(d) 1フレームの描画例外でループ全体が止まらないようにする。次フレームで回復を試みる。
      battleDebug.renderErrorCount++;
      battleDebug.lastRenderError = (err && err.message) ? err.message : String(err);
    }
    requestAnimationFrame(tickRecent);
  }

  let stopped = false;

  async function poll() {
    if (stopped) return;
    let nextDelayMs = pollIntervalMs;
    battleDebug.requestCount++;
    // 3-(a) fetchにタイムアウトを付ける。無ければ、応答が返らないままだと
    // setTimeout連鎖が止まる可能性があった（await fetch()がいつまでも解決しないため）。
    const abortController = new AbortController();
    const timeoutHandle = setTimeout(() => abortController.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(`${API_BASE}/event-battles/${battleId}/score`, {
        signal: abortController.signal,
        cache: 'no-store', // 3-(e) ブラウザのHTTPキャッシュ・ETagによる条件付きGETを避ける
      });
      clearTimeout(timeoutHandle);
      if (res.status === 404) {
        const body = await res.json().catch(() => null);
        showFatalError(
          (body && body.error === 'BATTLE_NOT_FOUND')
            ? '指定された対抗戦ペアが見つかりません。URLを確認してください。'
            : '対抗戦データの取得に失敗しました。'
        );
        stopped = true;
        return;
      }
      if (res.status === 429) {
        // レート制限（大規模イベント対応トラックA、2026-09-28）：最後の表示を保持したまま、
        // Retry-Afterがあればその秒数（上限60秒）待ってから再開する。無ければ通常間隔のまま。
        const retryAfterHeader = res.headers.get('retry-after');
        const retryAfterSec = retryAfterHeader ? Math.min(parseInt(retryAfterHeader, 10) || 0, 60) : 0;
        if (retryAfterSec > 0) nextDelayMs = retryAfterSec * 1000;
        showConnError('更新待機中（アクセス制限）');
        return;
      }
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      const data = await res.json();
      clearConnError();
      const now = Date.now();
      try {
        render(data);
        if (gaugeMode === 'recent') {
          updateCounterRate(data.team_a.total_intensity, data.team_b.total_intensity, now);
          // 戻り値（A位置）はtickRecent()側で使わなくなった（このファイル冒頭の
          // gaugeAnimStateのコメント参照）。呼び出しはhistory・leader・lastMagnitudeの
          // 更新のため。
          updateGaugeRecent(data.team_a.total_intensity, data.team_b.total_intensity, now);
        }
        recordPollSuccess(now);
      } catch (renderErr) {
        // 3-(d) 描画の例外は握りつぶし、直前の表示を保持したまま次のポーリングへ続ける
        // （lastOkAtは更新しない＝表示が実際には更新されていないため、staleIndicatorの
        // 判定に影響させる）。次回の描画で回復するか、window.__battleDebugで確認できる。
        battleDebug.renderErrorCount++;
        battleDebug.lastRenderError = (renderErr && renderErr.message) ? renderErr.message : String(renderErr);
      }
    } catch (e) {
      clearTimeout(timeoutHandle);
      if (e && e.name === 'AbortError') {
        battleDebug.timeoutCount++;
      } else {
        battleDebug.failureCount++;
      }
      // 一時的な通信断は致命エラーにせず、直前の表示を保持したまま次回ポーリングへ続ける
      if (!battleContent.hidden) {
        showConnError('サーバーに接続できません。再試行しています…');
      } else {
        showFatalError('サーバーに接続できませんでした: ' + e.message);
        stopped = true;
      }
    } finally {
      if (!stopped) setTimeout(poll, nextDelayMs);
    }
  }

  poll();
  if (gaugeMode === 'recent') requestAnimationFrame(tickRecent);
})();
</script>
</body>
</html>
