<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>対抗戦 | 推しフル</title>
<style>
  :root {
    --bg: #0b0f14;
    --text: #f4f6f8;
    --text-muted: #9aa4af;
    --team-a-color: #e63946;
    --team-b-color: #3a86ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 16px;
  }
  #label {
    text-align: center;
    font-size: clamp(16px, 2.5vw, 28px);
    color: var(--text-muted);
    margin-bottom: 12px;
    min-height: 1.4em;
  }
  #connErrorBanner {
    display: none;
    text-align: center;
    background: #b3261e;
    color: #fff;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
  }
  #connErrorBanner.visible { display: block; }

  #battleGrid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    align-items: stretch;
    min-height: 0;
  }
  .team-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    padding: 20px;
    min-width: 0;
  }
  #panelA { background: linear-gradient(160deg, color-mix(in srgb, var(--team-a-color) 28%, #0b0f14), #0b0f14); }
  #panelB { background: linear-gradient(200deg, color-mix(in srgb, var(--team-b-color) 28%, #0b0f14), #0b0f14); }

  .team-logo {
    width: clamp(48px, 8vw, 96px);
    height: clamp(48px, 8vw, 96px);
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 10px;
    background: #1f2733;
  }
  .team-logo-fallback {
    width: clamp(48px, 8vw, 96px);
    height: clamp(48px, 8vw, 96px);
    border-radius: 50%;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: clamp(20px, 3vw, 36px);
    color: #fff;
  }
  .team-name {
    font-size: clamp(18px, 3vw, 32px);
    font-weight: bold;
    text-align: center;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .team-event-title {
    font-size: clamp(11px, 1.4vw, 14px);
    color: var(--text-muted);
    margin-bottom: 14px;
    text-align: center;
  }
  .team-score {
    font-size: clamp(40px, 9vw, 96px);
    font-weight: bold;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .team-score-unit {
    font-size: clamp(12px, 1.6vw, 16px);
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .gauge-track {
    width: 100%;
    max-width: 420px;
    height: 20px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
  }
  .gauge-fill {
    height: 100%;
    border-radius: 999px;
    width: 0%;
    transition: width 0.6s ease;
  }
  #gaugeFillA { background: var(--team-a-color); }
  #gaugeFillB { background: var(--team-b-color); margin-left: auto; }

  #vsDivider {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 3vw, 40px);
    font-weight: bold;
    color: var(--text-muted);
    padding: 0 8px;
  }

  #updatedAt {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 10px;
  }

  #loadingState, #errorState {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text-muted);
    text-align: center;
    padding: 20px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="connErrorBanner"></div>

  <div id="loadingState">読み込み中...</div>

  <div id="errorState" hidden></div>

  <div id="battleContent" hidden style="display: contents;">
    <div id="label"></div>
    <div id="battleGrid">
      <div id="panelA" class="team-panel">
        <div id="logoWrapA"></div>
        <div id="nameA" class="team-name"></div>
        <div id="eventTitleA" class="team-event-title"></div>
        <div id="scoreA" class="team-score">0</div>
        <div class="team-score-unit">応援強度</div>
        <div class="gauge-track"><div id="gaugeFillA" class="gauge-fill"></div></div>
      </div>
      <div id="vsDivider">VS</div>
      <div id="panelB" class="team-panel">
        <div id="logoWrapB"></div>
        <div id="nameB" class="team-name"></div>
        <div id="eventTitleB" class="team-event-title"></div>
        <div id="scoreB" class="team-score">0</div>
        <div class="team-score-unit">応援強度</div>
        <div class="gauge-track"><div id="gaugeFillB" class="gauge-fill"></div></div>
      </div>
    </div>
    <div id="updatedAt"></div>
  </div>
</div>

<script>
(function () {
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? '/api/v1'
    : 'https://api.cheerstick.com/api/v1';

  const POLL_INTERVAL_MS = 3000;

  const battleId = new URLSearchParams(location.search).get('battle_id');

  const loadingState = document.getElementById('loadingState');
  const errorState = document.getElementById('errorState');
  const battleContent = document.getElementById('battleContent');
  const connErrorBanner = document.getElementById('connErrorBanner');

  function showFatalError(message) {
    loadingState.hidden = true;
    battleContent.hidden = true;
    errorState.hidden = false;
    errorState.textContent = message;
  }

  function showConnError(message) {
    connErrorBanner.textContent = message;
    connErrorBanner.classList.add('visible');
  }

  function clearConnError() {
    connErrorBanner.classList.remove('visible');
  }

  if (!battleId) {
    showFatalError('URLに battle_id パラメータがありません。\n管理画面の「対抗戦ペア一覧」からURLをコピーしてください。');
    return;
  }

  function formatNumber(n) {
    return Number(n || 0).toLocaleString('ja-JP');
  }

  function colorFor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    const AVATAR_COLORS = ['#e63946', '#2a9d8f', '#e9c46a', '#8338ec', '#3a86ff', '#ff6b6b'];
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  function renderTeamPanel({ logoWrapEl, nameEl, eventTitleEl, team, fallbackColor }) {
    const org = team.organization;
    const name = org ? org.name : (team.event_title || '(チーム未設定)');
    nameEl.textContent = name;
    eventTitleEl.textContent = team.event_title || '';

    logoWrapEl.innerHTML = '';
    if (org && org.logo_url) {
      const img = document.createElement('img');
      img.className = 'team-logo';
      img.src = org.logo_url;
      img.alt = name;
      img.onerror = () => {
        img.remove();
        logoWrapEl.appendChild(buildFallbackAvatar(name, fallbackColor));
      };
      logoWrapEl.appendChild(img);
    } else {
      logoWrapEl.appendChild(buildFallbackAvatar(name, fallbackColor));
    }
  }

  function buildFallbackAvatar(name, fallbackColor) {
    const div = document.createElement('div');
    div.className = 'team-logo-fallback';
    div.style.background = fallbackColor;
    div.textContent = (name || '?').trim().charAt(0).toUpperCase();
    return div;
  }

  function render(data) {
    document.getElementById('label').textContent = data.label || '';

    const orgAColor = (data.team_a.organization && data.team_a.organization.color) || colorFor(data.team_a.event_id);
    const orgBColor = (data.team_b.organization && data.team_b.organization.color) || colorFor(data.team_b.event_id);
    document.documentElement.style.setProperty('--team-a-color', orgAColor);
    document.documentElement.style.setProperty('--team-b-color', orgBColor);

    renderTeamPanel({
      logoWrapEl: document.getElementById('logoWrapA'),
      nameEl: document.getElementById('nameA'),
      eventTitleEl: document.getElementById('eventTitleA'),
      team: data.team_a,
      fallbackColor: orgAColor,
    });
    renderTeamPanel({
      logoWrapEl: document.getElementById('logoWrapB'),
      nameEl: document.getElementById('nameB'),
      eventTitleEl: document.getElementById('eventTitleB'),
      team: data.team_b,
      fallbackColor: orgBColor,
    });

    document.getElementById('scoreA').textContent = formatNumber(data.team_a.total_intensity);
    document.getElementById('scoreB').textContent = formatNumber(data.team_b.total_intensity);

    // ゲージ：上限値は固定せず、両者のうち大きい方を100%として相対表示する
    // （まず動くものを優先。演出の調整は別途）。
    const maxVal = Math.max(data.team_a.total_intensity, data.team_b.total_intensity, 1);
    document.getElementById('gaugeFillA').style.width = `${Math.round((data.team_a.total_intensity / maxVal) * 100)}%`;
    document.getElementById('gaugeFillB').style.width = `${Math.round((data.team_b.total_intensity / maxVal) * 100)}%`;

    document.getElementById('updatedAt').textContent =
      '最終更新: ' + new Date(data.updated_at).toLocaleTimeString('ja-JP');

    loadingState.hidden = true;
    errorState.hidden = true;
    battleContent.hidden = false;
  }

  let stopped = false;

  async function poll() {
    if (stopped) return;
    try {
      const res = await fetch(`${API_BASE}/event-battles/${battleId}/score`);
      if (res.status === 404) {
        const body = await res.json().catch(() => null);
        showFatalError(
          (body && body.error === 'BATTLE_NOT_FOUND')
            ? '指定された対抗戦ペアが見つかりません。URLを確認してください。'
            : '対抗戦データの取得に失敗しました。'
        );
        stopped = true;
        return;
      }
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      const data = await res.json();
      clearConnError();
      render(data);
    } catch (e) {
      // 一時的な通信断は致命エラーにせず、直前の表示を保持したまま次回ポーリングへ続ける
      if (!battleContent.hidden) {
        showConnError('サーバーに接続できません。再試行しています…');
      } else {
        showFatalError('サーバーに接続できませんでした: ' + e.message);
        stopped = true;
      }
    } finally {
      if (!stopped) setTimeout(poll, POLL_INTERVAL_MS);
    }
  }

  poll();
})();
</script>
</body>
</html>
